<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
  <title>Twister — The Mini Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alan+Sans:wght@900&family=Inter+Tight:wght@400;500;700;900&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared.css">
  <style>
    /* Twister · logic: Figma wireframes board 04 (65:261) · look: Design UI section TWISTER (266:2031), Twister_00–14. */
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
    html, body { width:100%; height:100%; overflow:hidden; color:#fff; }
    .screen { display:none; position:absolute; inset:0; flex-direction:column; align-items:center; }
    .screen.active { display:flex; }
    .stack { justify-content:center; gap:18px; padding:20px 25px 24px; text-align:center; }
    .stack > .hg-btn { margin-top:auto; }

    /* ── Play (T3–T5) ── */
    #play { padding:15px 20px 12px; gap:8px; }
    .swatch { width:80px; height:80px; border-radius:50%; border:4px solid #fff; flex-shrink:0; }
    .hg-banner-body { right:150px; }
    .banner-swatch { position:absolute; left:176px; top:31px; }
    .steps { display:flex; gap:4px; }
    .stepdot { width:8px; height:8px; border-radius:50%; border:1px solid var(--dark-blue); background:transparent; }
    .stepdot.done { background:var(--green); }
    .stepdot.current { border-color:var(--bright-blue); }
    .holdtrack { width:96px; height:8px; border-radius:4px; background:var(--dark-blue); overflow:hidden; }
    .holdtrack i { display:block; height:100%; width:0; background:var(--green); }
    .hold .banner-swatch { display:none; }
    .hold .hg-banner-body { right:110px; }
    .hold .hg-banner-right { right:10px; top:26px; }

    .board-wrap { flex:1; width:100%; display:flex; align-items:center; justify-content:center; min-height:0; }
    .board {
      --dot: min(90px, calc((min(92vw, 352px) - 32px - 48px) / 3), calc((100vh - 290px - 72px) / 4));
      display:grid; grid-template-columns:repeat(3, var(--dot)); grid-template-rows:repeat(4, var(--dot)); gap:24px;
      padding:16px; border-radius:61px; background:#fff;
    }
    .dot { width:var(--dot); height:var(--dot); border-radius:50%; position:relative; display:flex; align-items:center; justify-content:center; transition:transform .12s; }
    .c-green  { background:#89BC0E; --ring:#648C05; }
    .c-yellow { background:#FFEC00; --ring:#C9B800; }
    .c-blue   { background:#00A0E4; --ring:#16749F; }
    .c-red    { background:#E6003A; --ring:#A30029; }
    .dot.held { box-shadow:inset 0 0 0 calc(var(--dot) * 0.2) var(--ring); }
    .dot.wrong, .dot.lifted { box-shadow:0 0 0 5px var(--dark-blue); }
    .dot.lifted { outline:4px dashed var(--dark-blue); outline-offset:5px; box-shadow:none; }
    .dot .mark { font-family:var(--f-display); font-weight:900; font-size:calc(var(--dot) * 0.45); color:#fff; text-shadow:0 2px 6px rgba(0,31,59,.6); }
    .board.frozen .dot:not(.held):not(.wrong):not(.lifted) { opacity:0.35; }

    /* T2 · Countdown */
    .countdown { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; gap:10px; padding:56px 20px 20px; z-index:5; background:inherit; }
    body.hg-game .countdown { background-color:var(--green); background-image:url('assets/bg-pattern.webp'); background-size:626px 352px; }
    .countdown.on { display:flex; }
    .countdown .hg-tag { width:100%; max-width:330px; margin-bottom:40px; }
    .cd-num { animation:pop 0.5s ease-out; }
    .cd-num.go { font-size:180px; }
    .cd-hint { font-family:var(--f-ui); font-weight:700; font-size:15px; color:var(--dark-blue); margin-top:auto; }
    @keyframes pop { 0%{transform:scale(1.5);} 100%{transform:scale(1);} }

    /* T8 / T9 · fail card over the frozen board */
    .failcard { position:absolute; left:20px; right:20px; bottom:14px; z-index:6; display:none; align-items:center; text-align:center;
      border:4px solid var(--dark-blue); margin:0 auto; max-width:352px; }
    .failcard.on { display:flex; }

    /* T6 · GREAT! */
    .great .hg-tag { width:100%; max-width:352px; justify-content:space-between; padding:14px 22px; }
    .great .hg-tag .hg-tag-name { font-size:24px; }
    .great .hg-tag-pts { margin-right:auto; }
    .score-fail { background:var(--red); }
    .score-fail .hg-score-val { font-size:52px; }
  </style>
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KTRVRJ5D"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->
  <div class="hg-body">
    <div id="upnext" class="screen stack hg-scroll"></div>          <!-- T1 · Up next (G2) -->

    <div id="play" class="screen">                                    <!-- T2–T5, T8, T9 -->
      <div class="hg-banner" id="banner">
        <div class="hg-banner-bg"></div>
        <div class="hg-tag"><div class="hg-tag-name" id="who"></div></div>
        <div class="hg-banner-body">
          <div class="hg-banner-title" id="call"></div>
          <div id="under"></div>
        </div>
        <div class="banner-swatch swatch" id="swatch"></div>
        <div class="hg-banner-right" id="timerslot"></div>
      </div>
      <div class="board-wrap"><div class="board" id="board"></div></div>
      <div class="countdown" id="countdown">
        <div id="cd-tag"></div>
        <div class="hg-count-word" id="cd-word"></div>
        <div class="hg-count cd-num" id="cd-num"></div>
        <div class="cd-hint">Hold your hand above the screen</div>
      </div>
      <div class="hg-card failcard" id="failcard"></div>
    </div>

    <div id="great" class="screen stack great"></div>                <!-- T6 -->
    <div id="results" class="screen stack hg-scroll"></div>          <!-- T7 -->
    <div id="lb" class="screen stack hg-scroll"></div>               <!-- G3 -->
  </div>

  <script src="../../shared.js"></script>
  <script>
    // ── Config (par / slow from playtests — placeholders) ──
    var CFG = {
      PAR_MS: 5000, SLOW_MS: 15000,   // speed curve, time includes the 2 s hold
      CAP_MS: 45000,                  // 45 s cap → "Time's up!"
      HOLD_MS: 2000,
      CALLS: 4,
      SAME_MOMENT_MS: 60,             // two touches closer than this = "two fingers at once" (to confirm on device)
      NEXT_CALL_DELAY: 120,           // next call shows once the previous finger is confirmed down (> 100 ms)
      CTA_DELAY: 800                  // fingers are still on the glass: don't let the release tap the button
    };
    var COLORS = [
      { id:'green',  word:'GREEN',  hex:'#89BC0E' },
      { id:'yellow', word:'YELLOW', hex:'#FFEC00' },
      { id:'blue',   word:'BLUE',   hex:'#00A0E4' },
      { id:'red',    word:'RED',    hex:'#E6003A' }
    ];
    // 3 × 4 board, colours in rows (green, yellow, blue, red), 3 dots of each.
    var BOARD = [];
    COLORS.forEach(function (c) { for (var i = 0; i < 3; i++) BOARD.push(c); });

    var el = HG.el, clear = HG.clear, tap = HG.onTap;

    // ── Round state ──
    var players = [], order = [], turn = 0, results = [], calls = [], committed = false;
    // ── Attempt state ──
    var phase = 'idle';             // idle | countdown | calls | hold | over
    var step = 0, held = new Map(), dotFinger = [], lastTouchAt = -1e9;
    var clock = HG.Clock(), tickTimer = null, holdTimer = null, cdTimer = null, callTimer = null;
    var attemptStarted = false, replayOnResume = false;
    var timer = HG.timerRing(); document.getElementById('timerslot').appendChild(timer.el);

    function screen(id) {
      document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('active'); });
      document.getElementById(id).classList.add('active');
    }
    function btn(text, cls, fn) { var b = el('button', 'hg-btn ' + cls, text); tap(b, fn); return b; }

    // Calls: 4 colours, never one with no free dot left (3 dots each; max 2 calls per colour for variety).
    function makeCalls() {
      var used = {}, out = [];
      while (out.length < CFG.CALLS) {
        var c = COLORS[Math.floor(Math.random() * COLORS.length)];
        if ((used[c.id] || 0) >= 2) continue;
        if (out.length && out[out.length - 1].id === c.id) continue;
        used[c.id] = (used[c.id] || 0) + 1;
        out.push(c);
      }
      return out;
    }

    function newRound() {
      order = HG.shuffle(players);      // random draw, fixed for the round
      turn = 0; results = []; committed = false;
      calls = makeCalls();              // same calls for everyone in the round
      showUpNext();
    }

    // ── T1 · Up next ──
    function showUpNext() {
      phase = 'idle';
      screen('upnext');
      HG.shell.upNext(document.getElementById('upnext'), order, turn, startAttempt);
    }

    // ── Board ──
    var boardEl = document.getElementById('board');
    function renderBoard() {
      clear(boardEl);
      boardEl.classList.remove('frozen');
      BOARD.forEach(function (c, i) { var d = el('div', 'dot c-' + c.id); d.dataset.i = i; boardEl.appendChild(d); });
    }
    function dotEl(i) { return boardEl.children[i]; }
    function dotAt(x, y) {
      for (var i = 0; i < boardEl.children.length; i++) {
        var r = boardEl.children[i].getBoundingClientRect();
        var cx = r.left + r.width / 2, cy = r.top + r.height / 2, rad = r.width / 2;
        if ((x - cx) * (x - cx) + (y - cy) * (y - cy) <= rad * rad) return i;
      }
      return -1;
    }

    // ── Banner (T3–T5) ──
    var bannerEl = document.getElementById('banner');
    function renderUnder() {
      var u = document.getElementById('under'); clear(u);
      if (phase === 'hold') {
        var tr = el('div', 'holdtrack'); tr.appendChild(el('i')); tr.firstChild.id = 'holdfill';
        document.getElementById('call').appendChild(tr);
      }
      var s = el('div', 'steps');
      for (var i = 0; i <= CFG.CALLS; i++)          // 4 fingers + the hold
        s.appendChild(el('div', 'stepdot' + (i < step || (i === CFG.CALLS && phase === 'over' && step === CFG.CALLS) ? ' done' : i === step ? ' current' : '')));
      u.appendChild(s);
    }
    function showCall() {
      bannerEl.classList.remove('hold');
      var c = calls[step], call = document.getElementById('call'); clear(call);
      call.appendChild(document.createTextNode('Finger ' + (step + 1)));
      var ar = el('img'); ar.src = '../../assets/ui/icon-arrow.svg'; ar.alt = '→'; ar.style.width = '15px'; ar.style.filter = 'brightness(0) invert(13%) sepia(30%) saturate(3000%) hue-rotate(190deg)';
      call.appendChild(ar);
      var sw = document.getElementById('swatch'); sw.style.background = c.hex; sw.setAttribute('aria-label', c.word);
      renderUnder();
      HG.play('step');
    }
    function setCallText(text) { var call = document.getElementById('call'); clear(call); call.appendChild(document.createTextNode(text)); }
    function renderTime() {
      var ms = phase === 'countdown' ? 0 : clock.ms();
      timer.set(ms / CFG.CAP_MS, (ms / 1000).toFixed(1), 's');
    }

    // ── T2 · Countdown: Ready 3 · Steady 2 · Almost 1 · GO! ──
    function startAttempt() {
      clearTimers();
      attemptStarted = true; replayOnResume = false;
      phase = 'countdown'; step = 0; held = new Map(); dotFinger = []; lastTouchAt = -1e9;
      screen('play');
      document.getElementById('failcard').classList.remove('on');
      bannerEl.classList.remove('hold'); timer.el.classList.remove('lg');
      document.getElementById('who').textContent = order[turn];
      renderBoard(); renderTime(); setCallText('Get ready'); renderUnder();
      var cd = document.getElementById('countdown'); cd.classList.add('on');
      var tagslot = document.getElementById('cd-tag'); clear(tagslot);
      tagslot.appendChild(HG.tag(order[turn], { big: true, pts: HG.totals()[order[turn]] || 0 }));
      var seq = [['READY', '3'], ['STEADY', '2'], ['ALMOST', '1'], ['GO!', '']], k = 0;
      function tick() {
        if (k === seq.length) {
          cd.classList.remove('on');
          phase = 'calls';
          clock.start();
          tickTimer = setInterval(onTick, 100);
          showCall();
          return;
        }
        document.getElementById('cd-word').textContent = seq[k][0];
        var num = document.getElementById('cd-num');
        num.textContent = seq[k][1] || '0';
        num.classList.toggle('go', k === 3);
        num.style.visibility = k === 3 ? 'hidden' : '';
        num.style.animation = 'none'; void num.offsetWidth; num.style.animation = '';
        HG.play(k === 3 ? 'go' : 'tick');
        k++;
        cdTimer = setTimeout(tick, k === seq.length ? 500 : 1000);
      }
      tick();
    }

    function onTick() {
      renderTime();
      if (clock.ms() >= CFG.CAP_MS && (phase === 'calls' || phase === 'hold')) fail('timeout');
    }
    function clearTimers() {
      clearInterval(tickTimer); clearInterval(holdTimer); clearTimeout(cdTimer); clearTimeout(callTimer);
      tickTimer = holdTimer = cdTimer = callTimer = null;
    }

    // ── Touch ──
    var play = document.getElementById('play');
    play.addEventListener('touchstart', function (e) {
      e.preventDefault();
      if (phase !== 'calls' && phase !== 'hold') return;   // countdown touches ignored (no false start)
      var now = performance.now();
      // One finger at a time: two touches landing together = fail, wherever they land.
      if (e.changedTouches.length > 1 || now - lastTouchAt < CFG.SAME_MOMENT_MS) {
        lastTouchAt = now;
        var t0 = e.changedTouches[0];
        return fail('two', dotAt(t0.clientX, t0.clientY));
      }
      lastTouchAt = now;
      var t = e.changedTouches[0], i = dotAt(t.clientX, t.clientY);
      if (i === -1) return;                                  // between the dots / off the board: nothing
      if (dotFinger[i]) return fail('held', i);              // a dot already held
      if (phase === 'hold' || BOARD[i].id !== calls[step].id) return fail('wrong', i);
      held.set(t.identifier, i);
      dotFinger[i] = step + 1;
      dotEl(i).classList.add('held');
      step++;
      if (step === CFG.CALLS) return startHold();
      renderUnder();
      callTimer = setTimeout(showCall, CFG.NEXT_CALL_DELAY);
    }, { passive: false });

    function onRelease(e) {
      e.preventDefault();
      if (phase !== 'calls' && phase !== 'hold') return;
      for (var k = 0; k < e.changedTouches.length; k++) {
        var id = e.changedTouches[k].identifier;
        if (held.has(id)) return fail('slip', held.get(id));
      }
    }
    play.addEventListener('touchend', onRelease, { passive: false });
    play.addEventListener('touchcancel', onRelease, { passive: false });
    play.addEventListener('touchmove', function (e) {
      e.preventDefault();
      if (phase !== 'calls' && phase !== 'hold') return;
      for (var k = 0; k < e.changedTouches.length; k++) {
        var t = e.changedTouches[k];
        if (!held.has(t.identifier)) continue;
        var i = held.get(t.identifier), r = dotEl(i).getBoundingClientRect();
        var dx = t.clientX - (r.left + r.width / 2), dy = t.clientY - (r.top + r.height / 2);
        if (Math.sqrt(dx * dx + dy * dy) > r.width * 0.7) return fail('slip', i);   // finger slid off its dot
      }
    }, { passive: false });

    // ── T5 · Hold! (time keeps running, stops when the 2 s hold is done) ──
    function startHold() {
      phase = 'hold';
      clearTimeout(callTimer);
      bannerEl.classList.add('hold'); timer.el.classList.add('lg');
      setCallText('HOLD!');
      renderUnder();
      var t0 = clock.ms();
      holdTimer = setInterval(function () {
        var p = Math.min(1, (clock.ms() - t0) / CFG.HOLD_MS);
        var f = document.getElementById('holdfill'); if (f) f.style.width = (p * 100) + '%';
        if (p >= 1) success();
      }, 30);
    }

    // ── T6 · GREAT! ──
    function success() {
      clearTimers(); clock.stop(); phase = 'over';
      var ms = clock.ms();
      var r = { name: order[turn], ok: true, ms: ms, fingers: CFG.CALLS, seq: turn };
      results.push(r);
      HG.play('success'); HG.confetti();
      turnScreen('GREAT!', r, 'Score:', (ms / 1000).toFixed(1), 's', false);
    }

    // ── T8 / T9 · Fail (not in Design UI yet: same system, board kept visible) ──
    function fail(cause, dotIdx) {
      if (phase === 'over') return;
      clearTimers(); clock.stop(); phase = 'over';
      var fingers = held.size;
      var r = { name: order[turn], ok: false, ms: clock.ms(), fingers: fingers, cause: cause, seq: turn };
      results.push(r);
      HG.feedback('fail', boardEl);
      boardEl.classList.add('frozen');
      if (dotIdx !== undefined && dotIdx !== -1) {
        var d = dotEl(dotIdx);
        d.classList.add(cause === 'slip' ? 'lifted' : 'wrong');
        d.appendChild(el('span', 'mark', '✕'));
      }
      var called = step < CFG.CALLS ? calls[step].word + ' was called' : 'Hold, no new finger';
      var title = { slip: 'A finger slipped', timeout: "Time's up!", two: 'Two fingers at once', held: 'That dot is taken', wrong: 'Wrong colour' }[cause];
      setCallText('Oops!');
      var card = document.getElementById('failcard'); clear(card);
      card.appendChild(el('div', 'hg-card-title', 'Oops!'));
      card.appendChild(el('div', 'hg-h2', title));
      card.appendChild(el('div', 'hg-sub', cause === 'slip' ? 'Finger ' + (dotFinger[dotIdx] || '') + ' lifted' :
        cause === 'timeout' ? '45 s reached' : cause === 'two' ? 'One finger at a time' : called));
      var b = btn('Next', 'hg-btn-primary', function () { turnScreen('Oops!', r, 'Slipped', fingers + ' finger' + (fingers === 1 ? '' : 's'), '', true); });
      b.disabled = true; setTimeout(function () { b.disabled = false; }, CFG.CTA_DELAY);
      card.appendChild(b);
      card.classList.add('on');
    }

    // T6 layout, also used after a fail: title · player tag · SCORE panel · NEXT
    function turnScreen(title, r, label, value, unit, failed) {
      var c = document.getElementById('great'); clear(c);
      var h = el('div', 'hg-title shadow', title); c.appendChild(h);
      var tg = HG.tag(r.name, { pts: HG.totals()[r.name] || 0 });
      var finishers = results.filter(function (x) { return x.ok; });
      var place = r.ok ? 1 + finishers.filter(function (x) { return x.ms < r.ms; }).length : null;
      tg.appendChild(el('span', 'hg-move', '+' + Math.round(points(r)) + ' pts'));
      c.appendChild(tg);
      var panel = el('div', 'hg-score' + (failed ? ' score-fail' : ''));
      panel.appendChild(el('div', 'hg-score-label', label + (failed ? '' : '')));
      var v = el('div', 'hg-score-val', value); if (unit) v.appendChild(el('small', null, unit));
      panel.appendChild(v);
      c.appendChild(panel);
      c.appendChild(el('div', 'hg-sub light', place === 1 ? 'Fastest so far!' : place ? HG.ordinal(place) + ' so far' : 'Counted as a slip'));
      var b = btn(HG.t('next'), 'hg-btn-primary', showResults);
      b.disabled = true; setTimeout(function () { b.disabled = false; }, CFG.CTA_DELAY);
      c.appendChild(b);
      screen('great');
    }

    // ── Points & ranking ──
    function points(r) { return r.ok ? 50 + 50 * HG.speed(r.ms, CFG.PAR_MS, CFG.SLOW_MS) : 10 * r.fingers; }
    function cmp(a, b) {
      if (a.ok !== b.ok) return a.ok ? -1 : 1;
      return a.ok ? a.ms - b.ms : b.fingers - a.fingers;
    }

    // ── T7 · Round results: after every turn (players still to play keep an empty badge);
    //    after the last turn the scores are committed and NEXT goes to the leaderboard (G3). ──
    function showResults() {
      phase = 'idle';
      attemptStarted = false;
      var last = turn === order.length - 1;
      var pts = {};
      results.forEach(function (r) { pts[r.name] = points(r); });
      if (last && !committed) { HG.commitRound('twister', pts); committed = true; }
      var c = document.getElementById('results'); clear(c);
      c.appendChild(el('div', 'hg-titlebar', 'Round results'));
      var list = el('div', 'hg-ranks'); c.appendChild(list);
      HG.rank(results, cmp).forEach(function (r) {
        var res = r.item;
        var right = res.ok ? [['b', (res.ms / 1000).toFixed(1)], [null, 's']]
          : [[null, (res.cause === 'timeout' ? "Time's up · " : 'Slipped · ') + res.fingers + ' finger' + (res.fingers === 1 ? '' : 's')]];
        list.appendChild(HG.rankRow(r.place, res.name, right));
      });
      order.slice(turn + 1).forEach(function (n) { list.appendChild(HG.rankRow(null, n, null)); });
      if (last) {
        c.appendChild(btn(HG.t('next'), 'hg-btn-primary', showLeaderboard));
      } else {
        turn++;
        c.appendChild(btn(HG.t('next'), 'hg-btn-primary', showUpNext));
      }
      screen('results');
    }

    function showLeaderboard() {
      screen('lb');
      HG.shell.leaderboard(document.getElementById('lb'), newRound);
    }

    // ── Shell ──
    HG.shell.init({
      game: 'twister',
      logo: 'assets/logo.svg',
      tip: 'Keep every finger down. Lift one and your run is over!',
      howTo: {
        lines: ['Watch the colour at the top', 'Put a finger on the right colour', 'Keep every finger down', 'Hold until finished', 'Fastest wins!'],
        cta: 'Next'
      },
      currentPlayer: function () { return order[turn]; },
      hasProgress: function () { return !committed && (turn > 0 || attemptStarted || results.length > 0); },
      onPause: function () {
        // Pausing breaks the finger hold: Resume replays the attempt from the countdown.
        if (phase === 'countdown' || phase === 'calls' || phase === 'hold') {
          clearTimers(); clock.stop(); phase = 'idle'; replayOnResume = true;
          document.getElementById('countdown').classList.remove('on');
        }
      },
      onResume: function () { if (replayOnResume) startAttempt(); }
    });

    players = HG.getPlayers();
    if (!players.length) players = ['Player 1'];
    HG.shell.begin(['assets/logo.svg', 'assets/bg-pattern.webp'], newRound);
  </script>
</body>
</html>
