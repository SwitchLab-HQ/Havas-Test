  <style>
    /* Cluedo · Three Clues · logic: wireframes board 07 (65:343) + 0. Claude/Cluedo_Wireframe_Brief.md
       · look: Design UI section CLUEDO (277:2512), Cluedo_00–11. */
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
    html, body { width:100%; height:100%; overflow:hidden; color:#fff; }
    .screen { display:none; position:absolute; inset:0; flex-direction:column; align-items:center; }
    .screen.active { display:flex; }
    .stack { justify-content:center; gap:16px; padding:20px 20px 24px; text-align:center; }
    .stack > .hg-btn:first-of-type { margin-top:auto; }
    .note { font-family:var(--f-body); font-size:13px; color:#fff; }
    .shout { font-family:var(--f-display); font-weight:900; font-size:30px; line-height:1.1; color:#fff; text-transform:uppercase;
      -webkit-text-stroke:6px var(--dark-blue); paint-order:stroke fill; }
    .lead { font-family:var(--f-display); font-weight:900; font-size:18px; line-height:1.3; color:#fff; max-width:340px; }

    /* K1 · case intro */
    .introcard { text-align:left; gap:10px; }
    .introcard .hg-card-title { font-size:28px; text-align:left; }
    .clues { display:flex; gap:10px; }
    .clue { flex:1; display:flex; flex-direction:column; align-items:center; gap:8px; min-width:0; }
    .clue-art { width:100%; aspect-ratio:1/1; border-radius:10px; overflow:hidden; display:grid; grid-template-columns:repeat(3,1fr); gap:2px; background:var(--dark-blue); }
    .clue-art div { background-size:300% 300%; }
    .clue-lbl { font-family:var(--f-display); font-weight:900; font-size:11px; text-transform:uppercase; }
    .chips { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; max-width:352px; }
    .chips .hg-tag { padding:6px 12px; }
    .chips .hg-tag-name { font-size:14px; }

    /* K2 · pass the phone */
    .pass .hg-tag.lg { width:100%; max-width:352px; }
    .rebuild { width:100%; max-width:352px; background:#fff; border-radius:32px; padding:14px; display:flex; align-items:center; gap:14px; color:var(--dark-blue); text-align:left; }
    .rebuild .thumb { width:84px; height:84px; border-radius:12px; background-size:cover; background-position:center; flex-shrink:0; }
    .rebuild small { display:block; font-family:var(--f-display); font-weight:900; font-size:11px; text-transform:uppercase; }
    .rebuild b { display:block; font-family:var(--f-display); font-weight:900; font-size:24px; text-transform:uppercase; margin-top:4px; }

    /* K3 · solve */
    #solve { padding:15px 20px 14px; gap:8px; }
    .hg-banner-body { right:90px; }
    #solve .hg-banner-title { font-size:22px; }
    .pills { display:flex; gap:4px; margin-top:3px; }
    .pill { font-family:var(--f-body); font-weight:700; font-size:11px; padding:5px 9px; border-radius:12px; border:1.5px solid var(--dark-blue); color:var(--dark-blue); white-space:nowrap; }
    .pill.cur { background:var(--dark-blue); color:#fff; }
    .pill.found { background:var(--green); border-color:var(--green); color:var(--dark-blue); }
    .tagfound { position:absolute; right:92px; top:4px; z-index:2; font-family:var(--f-display); font-weight:900; font-size:11px; padding:5px 10px; border-radius:12px; background:var(--green); color:var(--dark-blue); text-transform:uppercase; }
    .puzzlewrap { --s: min(350px, 92vw, calc(100vh - 44px - 15px - 121px - 8px - 70px - 40px)); width:var(--s); height:var(--s); background:#fff; border-radius:32px; padding:12px; position:relative; flex-shrink:0; }
    .puzzle { position:relative; width:100%; height:100%; touch-action:none; }
    .tile { position:absolute; width:33.333%; height:33.333%; padding:2px; transition:transform 0.2s ease; will-change:transform; }
    .tile i { display:block; width:100%; height:100%; border-radius:10px; background-size:300% 300%; }
    .tile.sel i { box-shadow:0 0 0 4px var(--light-blue), 0 0 0 7px var(--dark-blue); }
    .tile.sel { z-index:3; }
    .tile.drag { transition:none; z-index:5; }
    .tile.drag i { box-shadow:0 10px 24px rgba(0,31,59,0.5), 0 0 0 3px var(--light-blue); }
    .puzzle.whole .tile { padding:0; transition:padding 0.4s, transform 0.2s; }
    .puzzle.whole .tile i { border-radius:0; }
    .puzzle.whole { border-radius:20px; overflow:hidden; }
    .puzzle .uncut { position:absolute; inset:0; z-index:4; background-size:100% 100%; }   /* CL-01: one picture, no seams */
    .puzzle.dim { opacity:0.3; }
    .overmsg { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center; padding:20px; z-index:6; }
    .overmsg.on { display:flex; }
    .overmsg .hg-title { color:#fff; -webkit-text-stroke:8px var(--dark-blue); paint-order:stroke fill; font-size:46px; }
    .overmsg p { font-family:var(--f-display); font-weight:900; font-size:15px; color:var(--dark-blue); }
    .solve-foot { width:100%; display:flex; flex-direction:column; align-items:center; margin-top:auto; }
    .ptspill { display:inline-flex; align-items:baseline; gap:4px; padding:8px 18px; border-radius:24px; background:var(--dark-blue); color:#fff; font-family:var(--f-display); font-weight:900; font-size:22px; }
    .ptspill small { font-family:var(--f-ui); font-weight:400; font-size:13px; }
    #found { padding:15px 20px 14px; gap:12px; }
    .foundbar { width:100%; max-width:352px; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:6px 8px; border-radius:30px; background:var(--light-blue); }
    .foundart { width:min(300px, 80vw); aspect-ratio:1/1; border-radius:28px; border:10px solid #fff; background-size:cover; background-position:center; }

    /* K5 / K6 / K12 cards */
    .cards { display:flex; gap:8px; width:100%; max-width:352px; }
    .card { flex:1; perspective:600px; display:flex; flex-direction:column; align-items:center; gap:6px; min-width:0; padding:10px 8px 12px; border-radius:20px; background:#fff; color:var(--dark-blue); }
    .card-lbl { font-family:var(--f-display); font-weight:900; font-size:11px; text-transform:uppercase; }
    .card-in { width:100%; aspect-ratio:1/1; position:relative; transform-style:preserve-3d; transition:transform 0.6s; }
    .card.up .card-in { transform:rotateY(180deg); }
    .face { position:absolute; inset:0; border-radius:12px; backface-visibility:hidden; -webkit-backface-visibility:hidden; overflow:hidden; }
    .face.back { background:rgba(0,31,59,0.1); border:2px dashed rgba(0,31,59,0.35); display:flex; align-items:center; justify-content:center; font-family:var(--f-display); font-weight:900; font-size:34px; color:var(--dark-blue); }
    .face.front { transform:rotateY(180deg); background-size:cover; background-position:center; }
    .card-name { font-family:var(--f-display); font-weight:900; font-size:13px; line-height:1.15; text-align:center; min-height:30px; }
    .card.tap { background:var(--dark-blue); color:var(--light-blue); border:2px dashed var(--light-blue); }
    .card.tap .face.back { background:transparent; border:none; color:var(--light-blue); }
    .card.tap .card-name::after { content:'Tap to reveal'; font-family:var(--f-body); font-weight:400; font-size:10px; color:#fff; }

    /* K7 / K12 results */
    .bonuspill { font-family:var(--f-display); font-weight:900; font-size:14px; color:#fff; background:var(--bright-blue); padding:5px 14px; border-radius:16px; margin-top:-10px; }
  </style>

  <script>
    var el = HG.el, clear = HG.clear, tap = HG.onTap;
    var CFG = { TIME_MS: 35000, PAR_MS: 8000, SLOW_MS: 35000, LOCK_MS: 2500 };   // par / slow: placeholders until playtests

    // ── Content: the 6 suspects of the Hasbro Cluedo toolkit, 9 rooms, 6 weapons ──
    // Art (2026-11-11, 2. Crea/1. Cluedo): one square picture (800 × 800) per suspect, room and weapon,
    // e.g. assets/puzzles/cluedo-weapon-rope-01.webp. A clue played twice in a case reuses its picture.
    // Fallbacks if a file is missing: a placeholder scene (assets/scenes/scene-NN.png), else a picture drawn in code.
    var POOL = {
      who: { n: 2, label: 'Culprit', the: 'the culprit', items: [
        { id: 'scarlett', name: 'Miss Scarlett', col: '#AF231C', art: '🌹' },
        { id: 'mustard', name: 'Colonel Mustard', col: '#FFC72C', art: '🎖️' },
        { id: 'peacock', name: 'Solicitor Peacock', col: '#567BC6', art: '🦚' },
        { id: 'plum', name: 'Professor Plum', col: '#662656', art: '🎓' },
        { id: 'white', name: 'Chef White', col: '#d9d9d9', art: '👨‍🍳' },
        { id: 'green', name: 'Mayor Green', col: '#007A30', art: '🎩' } ] },
      where: { n: 3, label: 'Room', the: 'the room', items: [
        { id: 'ballroom', name: 'Ballroom', col: '#8e44ad', art: '🪩' },
        { id: 'billiard-room', name: 'Billiard Room', col: '#1e8449', art: '🎱' },
        { id: 'dining-room', name: 'Dining Room', col: '#a04000', art: '🍽️' },
        { id: 'hall', name: 'Hall', col: '#7f8c8d', art: '🚪' },
        { id: 'conservatory', name: 'Conservatory', col: '#27ae60', art: '🪴' },
        { id: 'kitchen', name: 'Kitchen', col: '#d35400', art: '🍳' },
        { id: 'library', name: 'Library', col: '#6e2c00', art: '📚' },
        { id: 'lounge', name: 'Lounge', col: '#b03a2e', art: '🛋️' },
        { id: 'study', name: 'Study', col: '#2e4053', art: '🖋️' } ] },
      what: { n: 3, label: 'Weapon', the: 'the weapon', items: [
        { id: 'candlestick', name: 'Candlestick', col: '#b7950b', art: '🕯️' },
        { id: 'dagger', name: 'Dagger', col: '#566573', art: '🗡️' },
        { id: 'lead-pipe', name: 'Lead Pipe', col: '#5d6d7e', art: '🔩' },
        { id: 'revolver', name: 'Revolver', col: '#424949', art: '🔫' },
        { id: 'rope', name: 'Rope', col: '#a0522d', art: '🪢' },
        { id: 'spanner', name: 'Spanner', col: '#2874a6', art: '🔧' } ] }
    };
    var KIND_FILE = { who: 'suspect', where: 'room', what: 'weapon' };
    // ── Placeholder art: a busy, non-flat picture per subject and framing ──
    function drawArt(kind, item, v) {
      var S = 720, c = document.createElement('canvas'); c.width = c.height = S;
      var g = c.getContext('2d');
      var grd = g.createLinearGradient(0, 0, S, S);
      grd.addColorStop(0, item.col); grd.addColorStop(1, '#141a30'); g.fillStyle = grd; g.fillRect(0, 0, S, S);
      var cx = [0.3, 0.7, 0.5][v - 1] * S, cy = [0.35, 0.6, 0.75][v - 1] * S;
      g.lineWidth = 10;
      for (var r = 30; r < S * 1.3; r += 46) {
        g.strokeStyle = 'rgba(255,255,255,' + (0.05 + (r / 46 % 3) * 0.05) + ')';
        g.beginPath(); g.arc(cx, cy, r, 0, 7); g.stroke();
      }
      g.save(); g.translate(S / 2, S / 2); g.rotate((v - 2) * 0.5);
      for (var x = -S; x < S; x += 60) { g.fillStyle = 'rgba(0,0,0,' + (0.06 + ((x / 60) & 1) * 0.06) + ')'; g.fillRect(x, -S, 26, 2 * S); }
      g.restore();
      for (var i = 0; i < 40; i++) {
        var px = ((i * 97 + v * 53) % 100) / 100 * S, py = ((i * 61 + v * 29) % 100) / 100 * S;
        g.fillStyle = 'rgba(255,255,255,' + (0.08 + (i % 4) * 0.04) + ')';
        g.beginPath(); g.arc(px, py, 6 + (i % 5) * 4, 0, 7); g.fill();
      }
      // Corner-to-corner light shift so every piece has its own tone.
      var corner = [[0, 0], [S, 0], [0, S]][v - 1];
      var light = g.createRadialGradient(corner[0], corner[1], 0, corner[0], corner[1], S * 1.3);
      light.addColorStop(0, 'rgba(255,255,255,0.45)'); light.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = light; g.fillRect(0, 0, S, S);
      // Big lettering across the whole picture: every tile carries part of a letter.
      g.save(); g.translate(S / 2, S / 2); g.rotate([-0.12, 0.1, 0][v - 1]);
      g.textAlign = 'center'; g.textBaseline = 'middle';
      var words = item.name.toUpperCase().split(' '), fs = words.length > 1 ? 190 : 230;
      g.font = '900 ' + fs + 'px "Alan Sans", Impact, Arial';
      g.lineWidth = 14; g.strokeStyle = 'rgba(0,0,0,0.55)'; g.fillStyle = ['#ffffff', '#FFC72C', '#ffe0d6'][v - 1];
      words.forEach(function (w, i) {
        var y = (i - (words.length - 1) / 2) * fs * 0.95;
        var scale = Math.min(1, (S * 0.92) / g.measureText(w).width);
        g.save(); g.scale(scale, 1); g.strokeText(w, 0, y); g.fillText(w, 0, y); g.restore();
      });
      g.restore();
      var size = [260, 320, 220][v - 1];
      g.font = size + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
      g.textAlign = 'center'; g.textBaseline = 'middle'; g.globalAlpha = 0.85;
      g.fillText(item.art, [0.25, 0.75, 0.8][v - 1] * S, [0.78, 0.2, 0.8][v - 1] * S);
      g.globalAlpha = 1;
      g.fillStyle = 'rgba(0,0,0,0.5)'; g.fillRect(0, 0, S, 8); g.fillRect(0, S - 8, S, 8);
      return c.toDataURL('image/jpeg', 0.85);
    }
    function artUrl(kind, item, v) {
      return 'assets/puzzles/cluedo-' + KIND_FILE[kind] + '-' + item.id + '-01.webp';   // one picture per item (v unused)
    }
    // Square crop (the puzzle is 3 × 3). Portrait / landscape art is cut top / middle / bottom
    // by framing v, so one picture already gives 2–3 different puzzles.
    function squareCrop(img, v, n) {
      var w = img.naturalWidth, h = img.naturalHeight, s = Math.min(w, h), S = 720;
      var f = n > 1 ? (v - 1) / (n - 1) : 0.5;
      var sx = (w - s) * (w > h ? f : 0.5), sy = (h - s) * (h > w ? f : 0.5);
      var c = document.createElement('canvas'); c.width = c.height = S;
      c.getContext('2d').drawImage(img, sx, sy, s, s, 0, 0, S, S);
      return c.toDataURL('image/jpeg', 0.88);
    }

    // Placeholder scenes: assets/scenes/scene-01.png, scene-02.png… (found by probing until the first gap).
    var scenes = null;
    function loadScenes(done) {
      if (scenes) return done();
      scenes = [];
      (function next(i) {
        var img = new Image(), name = 'assets/scenes/scene-' + (i < 10 ? '0' : '') + i + '.png';
        img.onload = function () { scenes.push(img); i < 99 ? next(i + 1) : done(); };
        img.onerror = function () { done(); };
        img.src = name;
      })(1);
    }

    // Preload the case's images before K1. Per puzzle, in order: the final art for that suspect / room /
    // weapon (assets/puzzles/…) → a placeholder scene → a placeholder drawn in code.
    function loadCaseArt(done) {
      loadScenes(function () {
        var jobs = [];
        ['who', 'where', 'what'].forEach(function (k) {
          for (var v = 1; v <= POOL[k].n; v++) jobs.push([k, v]);
        });
        // Spread the scenes over the case's clues: each clue gets its own scene while there are enough.
        var pool = HG.shuffle(scenes), sceneOf = { what: pool[0], where: pool[1 % (pool.length || 1)], who: pool[2 % (pool.length || 1)] };
        var left = jobs.length, missing = [];
        jobs.forEach(function (j) {
          var k = j[0], v = j[1], item = caseItems[k], img = new Image();
          img.onload = function () { art[k + v] = squareCrop(img, 1, 1); if (--left === 0) fill(); };
          img.onerror = function () { missing.push(j); if (--left === 0) fill(); };
          img.src = artUrl(k, item, v);
        });
        // A framing not delivered yet reuses another final picture of the same clue, then a scene, then a drawing.
        function fill() {
          missing.forEach(function (j) {
            var k = j[0], v = j[1], own = null;
            for (var w = 1; w <= POOL[k].n; w++) if (art[k + w] && !own) own = art[k + w];
            art[k + v] = own || (pool.length ? squareCrop(sceneOf[k], v, POOL[k].n) : drawArt(k, caseItems[k], v));
          });
          done();
        }
      });
    }
    // Order: With what → Where → Who, then again. Who comes last so that at 8 players Who gets 2 turns, the others 3.
    var SEQ = ['what', 'where', 'who', 'what', 'where', 'who', 'what', 'where'];

    // ── Case state ──
    var players = [], order = [], caseItems = {}, caseNo = 0, art = {}, turns = [], ti = 0;
    var found = { who: false, where: false, what: false }, solves = [], committed = false, wakeLock = null;
    // ── Turn state ──
    var slots = [], clock = HG.Clock(), timer = null, inTurn = false, sel = null, drag = null;
    var ring = HG.timerRing(); document.getElementById('timerslot').appendChild(ring.el);

    function screen(id) {
      document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('active'); });
      document.getElementById(id).classList.add('active');
    }
    function btn(text, cls, fn) { var b = el('button', 'hg-btn ' + cls, text); tap(b, fn); return b; }
    function puzzlesPerPlayer() { var n = players.length; return n === 1 ? 3 : n === 2 ? 2 : 1; }
    function itemName(kind, item) { return kind === 'who' ? item.name : 'The ' + item.name; }

    // ── New case: 1 suspect, 1 room, 1 weapon at random + a random case number ──
    function newCase() {
      players = HG.getPlayers(); if (!players.length) players = ['Player 1'];
      order = HG.shuffle(players);
      ['who', 'where', 'what'].forEach(function (k) {
        var items = POOL[k].items; caseItems[k] = items[Math.floor(Math.random() * items.length)];
      });
      caseNo = 100 + Math.floor(Math.random() * 900);
      found = { who: false, where: false, what: false }; solves = []; committed = false; ti = 0; art = {};
      // Fair turns: 1 player → 3 · 2 players → 4 (2 each) · 3–8 players → 1 each.
      var n = players.length, count = n === 1 ? 3 : n === 2 ? 4 : n, seen = { who: 0, where: 0, what: 0 };
      turns = [];
      for (var i = 0; i < count; i++) {
        var k = SEQ[i]; seen[k]++;
        turns.push({ kind: k, v: seen[k], player: order[i % n] });
      }
      var fontReady = document.fonts ? document.fonts.load('900 100px "Alan Sans"').catch(function () {}) : Promise.resolve();
      fontReady.then(function () { loadCaseArt(showIntro); });
    }

    function scrambledThumb(src) {
      var a = el('div', 'clue-art');
      scramble().forEach(function (piece) {
        var t = el('div'); t.style.backgroundImage = 'url(' + src + ')';
        t.style.backgroundPosition = (piece % 3) * 50 + '% ' + Math.floor(piece / 3) * 50 + '%';
        a.appendChild(t);
      });
      return a;
    }

    // ── K1 · Case intro ──
    function showIntro() {
      var c = document.getElementById('intro'); clear(c);
      c.appendChild(el('div', 'hg-titlebar', 'Case file #' + caseNo));
      var card = el('div', 'hg-card introcard');
      card.appendChild(el('div', 'hg-card-title', 'The three clues'));
      card.appendChild(el('div', 'hg-sub', 'Rebuild the culprit, the room and the weapon. Together.'));
      var row = el('div', 'clues');
      [['who', 'Who'], ['where', 'Where'], ['what', 'With what']].forEach(function (p) {
        var col = el('div', 'clue');
        col.appendChild(scrambledThumb(art[p[0] + 1]));
        col.appendChild(el('div', 'clue-lbl', p[1]));
        row.appendChild(col);
      });
      card.appendChild(row);
      c.appendChild(card);
      var chips = el('div', 'chips');
      order.forEach(function (n) { chips.appendChild(HG.tag(n)); });
      c.appendChild(chips);
      c.appendChild(el('div', 'note', players.length + (players.length === 1 ? ' detective · ' : ' detectives · ') + turns.length + ' turns · 35 s each'));
      c.appendChild(btn('Start investigation', 'hg-btn-primary', function () { requestWakeLock(); showPass(); }));
      screen('intro');
    }

    // ── K2 · Pass the phone ──
    function showPass() {
      var t = turns[ti], c = document.getElementById('pass'); clear(c);
      c.appendChild(el('div', 'hg-pill', 'Turn ' + (ti + 1) + ' of ' + turns.length));
      c.appendChild(el('div', 'shout', 'Pass the phone to'));
      c.appendChild(HG.tag(t.player, { big: true, pts: HG.totals()[t.player] || 0 }));
      var rb = el('div', 'rebuild');
      var th = el('div', 'thumb'); th.style.backgroundImage = 'url(' + art[t.kind + t.v] + ')'; th.style.filter = 'blur(6px)';
      rb.appendChild(th);
      var tx = el('div');
      tx.appendChild(el('small', null, "You'll rebuild" + (found[t.kind] ? ' again' : '')));
      tx.appendChild(el('b', null, POOL[t.kind].the));
      rb.appendChild(tx);
      c.appendChild(rb);
      c.appendChild(btn("I'm ready", 'hg-btn-primary', function () { HG.unlockAudio(); startTurn(); }));
      screen('pass');
    }

    // ── K3 · Solve ──
    function scramble() {
      var p;
      do { p = HG.shuffle([0, 1, 2, 3, 4, 5, 6, 7, 8]); }
      while (p.filter(function (x, i) { return x === i; }).length > 2);   // avoid near-solved starts
      return p;
    }
    var puzzle = document.getElementById('puzzle');
    function startTurn() {
      var t = turns[ti];
      inTurn = true; sel = null; drag = null;
      document.getElementById('overmsg').classList.remove('on');
      puzzle.className = 'puzzle';
      document.getElementById('who').textContent = t.player;
      renderPills(t.kind);
      var tagslot = document.getElementById('tagslot'); clear(tagslot);
      if (found[t.kind]) tagslot.appendChild(el('div', 'tagfound', 'Already found'));    // K11
      document.getElementById('goal').textContent = 'Rebuild ' + POOL[t.kind].the + (found[t.kind] ? ' again' : '');
      document.getElementById('hint').textContent = 'Swap the pieces';
      var foot = document.getElementById('solvefoot'); clear(foot);
      foot.appendChild(btn('Skip this clue', 'hg-btn-ghost', function () { if (inTurn && !HG.shell.isPaused()) endTurn('skip'); }));
      // slots[s] = piece shown in slot s. Solved when slots[s] === s for all 9.
      slots = scramble();
      clear(puzzle);
      for (var piece = 0; piece < 9; piece++) {
        var d = el('div', 'tile'), face = el('i'); d.dataset.piece = piece;
        face.style.backgroundImage = 'url(' + art[t.kind + t.v] + ')';
        face.style.backgroundPosition = (piece % 3) * 50 + '% ' + Math.floor(piece / 3) * 50 + '%';
        d.appendChild(face); puzzle.appendChild(d);
      }
      placeAll();
      screen('solve');
      clock = HG.Clock(); clock.start();               // the timer starts on the first frame of K3
      clearInterval(timer); timer = setInterval(tickTimer, 100); tickTimer();
    }
    function renderPills(cur) {
      var p = document.getElementById('pills'); clear(p);
      ['who', 'where', 'what'].forEach(function (k) {
        p.appendChild(el('div', 'pill' + (found[k] ? ' found' : k === cur ? ' cur' : ''), POOL[k].label + (found[k] ? ' ✓' : '')));
      });
    }
    function tileOf(piece) { return puzzle.children[piece]; }
    function placeAll() {
      slots.forEach(function (piece, s) {
        tileOf(piece).style.transform = 'translate(' + (s % 3) * 100 + '%,' + Math.floor(s / 3) * 100 + '%)';
      });
    }
    function tickTimer() {
      var left = Math.max(0, CFG.TIME_MS - clock.ms());
      ring.set(left / CFG.TIME_MS, String(Math.ceil(left / 1000)), 's', left < 10000 ? '#ea3557' : '#a7c919');
      if (left <= 0 && inTurn) endTurn('timeout');
    }

    // ── K8 · Swap: drag a piece onto another, or tap one then another. No piece ever locks. ──
    function slotAt(x, y) {
      var r = puzzle.getBoundingClientRect();
      if (x < r.left || y < r.top || x > r.right || y > r.bottom) return -1;
      return Math.min(2, Math.floor((y - r.top) / (r.height / 3))) * 3 + Math.min(2, Math.floor((x - r.left) / (r.width / 3)));
    }
    puzzle.addEventListener('pointerdown', function (e) {
      if (!inTurn || drag || HG.shell.isPaused()) return;
      var s = slotAt(e.clientX, e.clientY); if (s < 0) return;
      drag = { id: e.pointerId, from: s, x: e.clientX, y: e.clientY, moved: false };
      try { puzzle.setPointerCapture(e.pointerId); } catch (x) {}
    });
    puzzle.addEventListener('pointermove', function (e) {
      if (!drag || e.pointerId !== drag.id) return;
      var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (!drag.moved && Math.hypot(dx, dy) < 8) return;
      if (!drag.moved) { drag.moved = true; clearSel(); tileOf(slots[drag.from]).classList.add('drag'); }
      var t = tileOf(slots[drag.from]), s = drag.from;
      t.style.transform = 'translate(calc(' + (s % 3) * 100 + '% + ' + dx + 'px), calc(' + Math.floor(s / 3) * 100 + '% + ' + dy + 'px)) scale(1.05)';
    });
    function pointerEnd(e, cancel) {
      if (!drag || e.pointerId !== drag.id) return;
      var d = drag; drag = null;
      if (!inTurn) return;
      if (d.moved) {
        tileOf(slots[d.from]).classList.remove('drag');
        var to = cancel ? -1 : slotAt(e.clientX, e.clientY);
        if (to >= 0 && to !== d.from) swap(d.from, to); else placeAll();
        return;
      }
      // Tap-tap: tap A (selected), tap B → swap. Tap A again = deselect.
      if (sel === null) { sel = d.from; tileOf(slots[sel]).classList.add('sel'); document.getElementById('hint').textContent = 'Tap another piece to swap · or drag'; }
      else if (sel === d.from) clearSel();
      else { var a = sel; clearSel(); swap(a, d.from); }
    }
    puzzle.addEventListener('pointerup', function (e) { pointerEnd(e, false); });
    puzzle.addEventListener('pointercancel', function (e) { pointerEnd(e, true); });
    function clearSel() {
      if (sel !== null) tileOf(slots[sel]).classList.remove('sel');
      sel = null; document.getElementById('hint').textContent = 'Swap the pieces';
    }
    function swap(a, b) {
      var tmp = slots[a]; slots[a] = slots[b]; slots[b] = tmp;
      placeAll(); HG.play('swap');
      if (slots.every(function (p, i) { return p === i; })) setTimeout(function () { if (inTurn) endTurn('solved'); }, 220);
    }

    function nextCta(t) {
      var last = ti === turns.length - 1;
      var nextName = last ? null : turns[ti + 1].player;
      return btn(last ? 'Lock in the answers' : (nextName === t.player ? 'Next clue' : 'Pass to ' + nextName), 'hg-btn-primary', function () {
        ti++;
        if (ti >= turns.length) showLock(); else showPass();
      });
    }

    // ── K4 Clue solved / K10 Time's up · skipped ──
    function endTurn(how) {
      inTurn = false; clock.stop(); clearInterval(timer); clearSel();
      var t = turns[ti], ms = clock.ms(), worth = 80 / puzzlesPerPlayer();
      var ok = how === 'solved';
      var pts = ok ? worth / 2 + (worth / 2) * HG.speed(ms, CFG.PAR_MS, CFG.SLOW_MS) : 0;
      var wasFound = found[t.kind];
      solves.push({ player: t.player, kind: t.kind, ok: ok, ms: ms, pts: pts, turn: ti });
      if (ok) found[t.kind] = true;
      var item = caseItems[t.kind];
      if (ok) {
        puzzle.classList.add('whole');                     // seams fade out, the art becomes whole
        // CL-01: once the gaps have closed (padding transition, 0.4 s), the 9 tiles are replaced by the uncut picture
        // (same file, same box), so no sub-pixel seam stays visible between the pieces.
        setTimeout(function () {
          var u = el('div', 'uncut'); u.style.backgroundImage = 'url(' + art[t.kind + t.v] + ')'; puzzle.appendChild(u);
        }, 400);
        HG.play('success');
        setTimeout(function () { showFound(t, item, ms, pts, wasFound); }, 650);
        return;
      }
      // K10: board dims, message over it, the clue stays open for a later puzzle (if any)
      puzzle.classList.add('dim');
      HG.play('fail');
      document.getElementById('hint').textContent = how === 'skip' ? 'Skipped' : 'Out of time';
      var m = document.getElementById('overmsg'); clear(m);
      m.appendChild(el('div', 'hg-title', how === 'skip' ? 'Skipped' : "Time's up!"));
      m.appendChild(el('p', null, 'No points for this puzzle.'));
      m.appendChild(el('p', null, 'The ' + POOL[t.kind].label.toLowerCase() + ' is ' + (found[t.kind] ? 'already found.' : 'still missing.')));
      m.classList.add('on');
      var foot = document.getElementById('solvefoot'); clear(foot);
      foot.appendChild(nextCta(t));
    }

    function showFound(t, item, ms, pts, wasFound) {
      var c = document.getElementById('found'); clear(c);
      var bar = el('div', 'foundbar');
      bar.appendChild(HG.tag(t.player));
      var pills = el('div', 'pills');
      ['who', 'where', 'what'].forEach(function (k) {
        pills.appendChild(el('div', 'pill' + (found[k] ? ' found' : ''), POOL[k].label + (found[k] ? ' ✓' : '')));
      });
      bar.appendChild(pills);
      c.appendChild(bar);
      var a = el('div', 'foundart'); a.style.backgroundImage = 'url(' + art[t.kind + t.v] + ')'; c.appendChild(a);
      c.appendChild(el('div', 'shout', POOL[t.kind].label + (wasFound ? ' rebuilt!' : ' found!')));
      c.appendChild(el('div', 'note', itemName(t.kind, item) + '  ·  ' + Math.round(ms / 1000) + ' s'));
      var pp = el('div', 'ptspill', '+' + Math.round(pts)); pp.appendChild(el('small', null, 'pts')); c.appendChild(pp);
      var cta = nextCta(t); cta.style.marginTop = 'auto'; c.appendChild(cta);
      screen('found');
    }

    // ── K5 · Locking in the answers (≈ 2.5 s, tap skips) ──
    function cards(revealUnsolved) {
      var row = el('div', 'cards');
      [['what', 'With what'], ['where', 'Where'], ['who', 'Who']].forEach(function (p) {
        var k = p[0], item = caseItems[k], card = el('div', 'card');
        card.appendChild(el('div', 'card-lbl', p[1]));
        var inner = el('div', 'card-in');
        inner.appendChild(el('div', 'face back', '?'));
        var front = el('div', 'face front'); front.style.backgroundImage = 'url(' + art[k + 1] + ')';
        inner.appendChild(front); card.appendChild(inner);
        var name = el('div', 'card-name', found[k] ? itemName(k, item) : '');
        card.appendChild(name);
        card.dataset.k = k;
        if (!found[k] && revealUnsolved) {
          card.classList.add('tap');
          tap(card, function () {
            if (card.classList.contains('up')) return;
            card.classList.add('up'); card.classList.remove('tap');
            name.textContent = itemName(k, item);
          });
        }
        row.appendChild(card);
      });
      return row;
    }
    function showLock() {
      releaseWakeLock();
      var c = document.getElementById('lock'); clear(c);
      c.appendChild(el('div', 'hg-titlebar sm', 'Locking in the answers…'));
      var row = cards(false); c.appendChild(row);
      c.appendChild(el('div', 'note', 'Each solved clue flips up as an answer'));
      screen('lock');
      Array.prototype.forEach.call(row.children, function (card, i) {
        if (found[card.dataset.k]) setTimeout(function () { card.classList.add('up'); HG.play('step'); }, 400 + i * 600);
      });
      var done = false;
      function go() { if (done) return; done = true; allFound() ? showVerdict() : showUnsolved(); }
      setTimeout(go, CFG.LOCK_MS);
      setTimeout(function () { tap(c, go); }, 150);
    }
    function allFound() { return found.who && found.where && found.what; }

    // ── K6 · The verdict ──
    function sentence(hideMissing) {
      var w = caseItems.who.name, r = caseItems.where.name, x = caseItems.what.name;
      if (hideMissing)   // K12: "Colonel Mustard, in the Study, with… ?"
        return (found.who ? w : '… ?') + ', ' + (found.where ? 'in the ' + r : 'in… ?') + ', ' +
          (found.what ? 'with the ' + x + '.' : 'with… ?');
      return w + ', in the ' + r + ', with the ' + x + '.';
    }
    // K6 / K7 / K12 (Design UI - 02): THE VERDICT + CASE SOLVED / CASE UNSOLVED bar, the 3 cards, the sentence,
    // SEE RESULTS → K8 Round results → NEXT → G3 Leaderboard.
    function verdictHead(c, solved) {
      c.appendChild(el('div', 'shout', 'The verdict'));
      c.appendChild(el('div', 'hg-titlebar sm', solved ? 'Case solved' : 'Case unsolved'));
      if (solved) c.appendChild(el('div', 'bonuspill', '+20pts Bonus'));
    }
    function showVerdict() {
      var c = document.getElementById('verdict'); clear(c);
      verdictHead(c, true);
      var row = cards(false); c.appendChild(row);
      Array.prototype.forEach.call(row.children, function (card) { card.classList.add('up'); });
      c.appendChild(el('div', 'lead', sentence(false)));
      c.appendChild(btn('See results', 'hg-btn-primary', function () { showResults(true); }));
      screen('verdict');
      HG.play('success'); HG.confetti();
    }

    // ── K12 · Case unsolved: the missing card stays face down; tap it to flip it. Never "you lost". ──
    function showUnsolved() {
      var c = document.getElementById('verdict'); clear(c);
      verdictHead(c, false);
      var row = cards(true); c.appendChild(row);
      Array.prototype.forEach.call(row.children, function (card) { if (found[card.dataset.k]) card.classList.add('up'); });
      c.appendChild(el('div', 'lead', sentence(true)));
      c.appendChild(btn('See results', 'hg-btn-primary', function () { showResults(false); }));
      screen('verdict');
    }

    // ── K8 · Round results (scores committed here): fastest solve first, then the others in play order ──
    function showResults(solved) {
      var pts = {};
      players.forEach(function (n) { pts[n] = 0; });
      solves.forEach(function (s) { pts[s.player] += s.pts; });
      if (solved) players.forEach(function (n) { pts[n] += 20; });   // case bonus for every player
      if (!committed) { HG.commitRound('cluedo', pts); committed = true; }
      var best = {};
      solves.forEach(function (s) { if (s.ok && (best[s.player] === undefined || s.ms < best[s.player])) best[s.player] = s.ms; });
      var c = document.getElementById('results'); clear(c);
      c.appendChild(el('div', 'hg-titlebar', 'Round results'));
      var list = el('div', 'hg-ranks'); c.appendChild(list);
      HG.rank(order, function (a, b) {                   // fastest first, "—" last, ties in play order
        var A = best[a], B = best[b];
        if (A === undefined && B === undefined) return 0;
        if (A === undefined) return 1; if (B === undefined) return -1;
        return A - B;
      }).forEach(function (r) {
        var n = r.item;
        list.appendChild(HG.rankRow(r.place, n, best[n] === undefined ? [[null, '—']] : [['b', (best[n] / 1000).toFixed(1)], ['w', 's']]));
      });
      c.appendChild(btn(HG.t('next'), 'hg-btn-primary', showLb));
      screen('results');
    }

    function showLb() { screen('lb'); HG.shell.leaderboard(document.getElementById('lb'), newCase); }

    // ── Wake lock during a case ──
    function requestWakeLock() {
      if (!('wakeLock' in navigator)) return;
      navigator.wakeLock.request('screen').then(function (l) { wakeLock = l; }).catch(function () {});
    }
    function releaseWakeLock() { if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; } }

    // ── Shell ──
    HG.shell.init({
      game: 'cluedo',
      headerLogo: 'assets/header-logo.svg',
      logo: 'assets/icon.webp',
      tip: 'Start with the corners: they are the easiest pieces to place.',
      howTo: {
        lines: ['Swap the pieces to rebuild the picture', 'Drag a piece, or tap two to swap', 'One clue per turn', 'Culprit, room or weapon', 'Solve all three as a team', 'Fastest solver is Top Detective'],
        cta: 'Got it'
      },
      currentPlayer: function () { return inTurn ? turns[ti].player : null; },
      hasProgress: function () { return !committed && (ti > 0 || inTurn); },
      onPause: function () { if (inTurn) { clock.pause(); clearInterval(timer); } releaseWakeLock(); },
      onResume: function () {
        if (inTurn) { clock.resume(); timer = setInterval(tickTimer, 100); }
        if (turns.length && ti < turns.length) requestWakeLock();
      },
      onQuit: releaseWakeLock
    });

    HG.shell.begin(['assets/header-logo.svg', 'assets/bg-pattern.webp'], newCase);
  </script>
</body>
</html>
