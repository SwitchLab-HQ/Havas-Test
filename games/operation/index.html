  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Alan+Sans:wght@900&family=Inter+Tight:wght@400;500;700;900&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">

  <style>
    /* Operation · logic: wireframes board 06 (65:316) · look: Design UI - 02 section OPERATION (283:2846), Operation_00–09.
       Board = "art + hitbox" (2026-11-03): the AD paints the path into the art and delivers a black / white mask at
       the same size (black = path, white = wall). Same for the tool: Operation_pince art + mask (circle = the bone,
       the part tested against the walls; rectangle = where the finger picks it up). */
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
    html, body { width:100%; height:100%; overflow:hidden; color:var(--dark-blue); }
    .screen { display:none; position:absolute; inset:0; flex-direction:column; align-items:center; }
    .screen.active { display:flex; }
    .stack { justify-content:center; gap:16px; padding:20px 20px 24px; text-align:center; }
    .stack > .hg-btn:first-of-type { margin-top:auto; }
    .note { font-family:var(--f-body); font-weight:700; font-size:14px; line-height:20px; color:var(--dark-blue); text-align:center; }

    /* Hitbox test only (CFG.TEST_PICKER) */
    .testpick { display:flex; align-items:center; gap:6px; font-family:var(--f-body); font-weight:700; font-size:12px; color:var(--dark-blue); }
    .testpick span { margin-right:2px; }
    .testpick button { width:38px; height:38px; border:2px solid var(--dark-blue); border-radius:50%; background:#fff; color:var(--dark-blue); font-family:var(--f-body); font-weight:900; font-size:13px; }
    .testpick button.on { background:var(--dark-blue); color:#fff; }

    /* O1 / O2 / O6 · HUD on top, the art fills the rest of the screen */
    #play { padding:15px 0 0; gap:8px; }
    #play .hg-banner { margin:0 20px; width:calc(100% - 40px); }
    .hg-banner-body { right:90px; gap:9px; }
    .touches { align-self:flex-start; font-family:var(--f-body); font-weight:700; font-size:11px; color:#fff; background:var(--dark-blue); padding:5px 10px; border-radius:12px; }
    .stage { position:relative; flex:1; width:100%; min-height:0; overflow:hidden; touch-action:none; }
    .stage .fill { position:absolute; inset:-30px; background-size:cover; background-position:center top; filter:blur(18px); opacity:.9; }
    .board { position:absolute; top:0; left:50%; transform-origin:0 0; }
    .board img.art { position:absolute; left:0; top:0; display:block; pointer-events:none; }
    .board img.tool { position:absolute; left:0; top:0; display:block; pointer-events:none; will-change:transform; }
    .board.ready img.tool { animation:toolpulse 1.1s ease-in-out infinite; }
    @keyframes toolpulse { 50% { filter:drop-shadow(0 0 14px rgba(255,255,255,.95)); } }
    /* BZZT! (O6): red flash under the header for a moment */
    .bzzt { position:fixed; left:0; right:0; top:44px; bottom:0; z-index:40; display:none; flex-direction:column; align-items:center; justify-content:center; gap:24px; pointer-events:none;
      background:rgba(230,0,58,0.55); }
    .bzzt.on { display:flex; }
    .bzzt .hg-title { font-size:84px; color:#fff; -webkit-text-stroke:10px var(--dark-blue); paint-order:stroke fill; }
    .minus { font-family:var(--f-display); font-weight:900; font-size:22px; color:#fff; background:var(--dark-blue); padding:9px 18px; border-radius:32px; }

    /* O4 / O8 */
    .breakdown { width:100%; max-width:354px; background:#fff; border-radius:26px; padding:20px 24px; display:flex; flex-direction:column; gap:14px; }
    .breakdown div { display:flex; justify-content:space-between; font-family:var(--f-body); font-size:13px; opacity:0; transform:translateY(6px); transition:opacity .3s, transform .3s; }
    .breakdown div.in { opacity:1; transform:none; }
    .breakdown b { font-family:var(--f-body); font-weight:900; }
    #turnend { justify-content:flex-start; padding-top:40px; }
    #turnend.lifted { justify-content:center; }
    .shout { font-family:var(--f-display); font-weight:900; font-size:40px; line-height:1.05; color:#fff; text-transform:uppercase;
      -webkit-text-stroke:8px var(--dark-blue); paint-order:stroke fill; }

<body>
  <!-- Google Tag Manager (noscript) -->

  <div class="hg-body">
    <div id="upnext" class="screen stack hg-scroll"></div>

    <div id="play" class="screen">
      <div class="hg-banner">
        <div class="hg-banner-bg"></div>
        <div class="hg-tag"><div class="hg-tag-name" id="who"></div></div>
        <div class="hg-banner-body">
          <div class="hg-banner-title" id="pathname"></div>
          <div class="touches" id="touches">0 touches</div>
        </div>
        <div class="hg-banner-right" id="timerslot"></div>
      </div>
      <div class="stage" id="stage">
        <div class="fill" id="fill"></div>
        <div class="board" id="board"><img class="art" id="art" alt=""><img class="tool" id="tool" alt=""></div>
      </div>
    </div>

    <div id="turnend" class="screen stack"></div>   <!-- O4 / O8 -->
    <div id="results" class="screen stack hg-scroll"></div>
    <div id="lb" class="screen stack hg-scroll"></div>
  </div>
  <div class="bzzt" id="bzzt"><div class="hg-title">BZZT!</div><div class="minus">−5 pts</div></div>

  <script src="../../shared.js"></script>
  <script>
    // ── Paths: one art + one mask each, same size (black = path, white = wall), in art pixels.
    //    start = centre of the start blob, exit = centre of the exit blob (where the bone comes out).
    //    Play again = another path (once there is more than one). Par / slow from playtests: placeholders. ──
    //    Hitbox test (2026-11-05): prod-01–05 go from the most forgiving to the strictest, the name is the margin set by the AD.
    var PATHS = [
      { name: 'Hitbox +8 pt', test: '+8', art: 'assets/paths/prod-01-art.webp', mask: 'assets/paths/prod-01-hitbox.png',
        start: [264, 400], exit: [992, 222], par: 7000, slow: 28000 },
      { name: 'Hitbox +6 pt', test: '+6', art: 'assets/paths/prod-02-art.webp', mask: 'assets/paths/prod-02-hitbox.png',
        start: [168, 1020], exit: [286, 242], par: 7000, slow: 28000 },
      { name: 'Hitbox +4 pt', test: '+4', art: 'assets/paths/prod-03-art.webp', mask: 'assets/paths/prod-03-hitbox.png',
        start: [278, 1050], exit: [832, 242], par: 7000, slow: 28000 },
      { name: 'Hitbox +2 pt', test: '+2', art: 'assets/paths/prod-04-art.webp', mask: 'assets/paths/prod-04-hitbox.png',
        start: [298, 1050], exit: [852, 242], par: 7000, slow: 28000 },
      { name: 'Hitbox +0 pt', test: '+0', art: 'assets/paths/prod-05-art.webp', mask: 'assets/paths/prod-05-hitbox.png',
        start: [334, 1050], exit: [888, 242], par: 7000, slow: 28000 }
    ];
    // Tool art + mask (Operation_pince_01 / _hitbox), same pixel scale as the path art.
    var TOOL = { art: 'assets/tool.webp', mask: 'assets/tool-hitbox.png' };
    var ART_W = 1200;            // art width = phone width at 390 px (Figma: 390 × 500.5 under the HUD)
    var CFG = {
      FIT_H: 1400,               // art pixels that must fit in height: the tool at the lowest start, down to the end of its grip
      EXIT_R: 70,                // bone out when its centre is this close to the exit (art px)
      GRIP_SLOP: 12,             // extra CSS px around the finger zone of the tool
      STEP: 8,                   // wall test every 8 art px along a move (no tunnelling through a wall)
      SNAP_BACK: 48,             // on a wall hit the bone jumps back at least this far along its trail (art px)
      CTA_DELAY: 800,
      TEST_PICKER: true          // hitbox test: path buttons on Up next. Set to false before launch.
    };
    var el = HG.el, clear = HG.clear, tap = HG.onTap;

    // ── Round state ──
    var players = [], order = [], turn = 0, results = [], pathIdx = -1, committed = false;
    var pinned = false, switching = false;   // hitbox test: a path picked by hand stays for Play again
    // ── Turn state ──
    var phase = 'idle';   // idle | ready (O1, waiting for pick-up) | run (O2) | over
    var touches = 0, maxProg = 0, picked = false, turnStarted = false;
    var trail = [];        // recent wall-free bone spots, newest last: where a wall hit sends the bone back
    var trackId = null, bone = { x: 0, y: 0 }, offX = 0, offY = 0;
    var clock = HG.Clock(), hudTimer = null;
    var timer = HG.timerRing(); document.getElementById('timerslot').appendChild(timer.el);

    // ── Geometry: everything in art pixels; k = CSS px per art px ──
    var stage = document.getElementById('stage'), boardEl = document.getElementById('board');
    var artEl = document.getElementById('art'), toolEl = document.getElementById('tool');
    var k = 1, artH = 0, wall = null, dist = null, DS = 4, dw = 0, dh = 0, startDist = 1;
    var tool = null;   // { w, h, cx, cy, r, grip: [x0, y0, x1, y1] } read from the tool mask

    function screen(id) {
      document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('active'); });
      document.getElementById(id).classList.add('active');
    }
    function btn(text, cls, fn) { var b = el('button', 'hg-btn ' + cls, text); tap(b, fn); return b; }

    function maskData(img) {
      var c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
      var g = c.getContext('2d'); g.drawImage(img, 0, 0);
      var d = g.getImageData(0, 0, c.width, c.height).data, out = new Uint8Array(c.width * c.height);
      for (var i = 0; i < out.length; i++) out[i] = d[i * 4] < 128 ? 1 : 0;   // 1 = black
      return { w: c.width, h: c.height, px: out };
    }
    // Tool mask: the round blob on top is the bone, the block under it is the finger zone.
    function readTool(img) {
      var m = maskData(img), rows = [];
      for (var y = 0; y < m.h; y++) {
        var x0 = -1, x1 = -1;
        for (var x = 0; x < m.w; x++) if (m.px[y * m.w + x]) { if (x0 < 0) x0 = x; x1 = x; }
        rows.push(x0 < 0 ? null : [x0, x1]);
      }
      var y = 0; while (!rows[y]) y++;
      var by0 = y; while (rows[y]) y++;
      var by1 = y - 1; while (!rows[y]) y++;
      var gy0 = y, gx0 = m.w, gx1 = 0;
      for (; y < m.h; y++) if (rows[y]) { gx0 = Math.min(gx0, rows[y][0]); gx1 = Math.max(gx1, rows[y][1]); }
      var bx0 = m.w, bx1 = 0;
      for (y = by0; y <= by1; y++) { bx0 = Math.min(bx0, rows[y][0]); bx1 = Math.max(bx1, rows[y][1]); }
      return { w: m.w, h: m.h, cx: (bx0 + bx1) / 2, cy: (by0 + by1) / 2, r: (by1 - by0) / 2, grip: [gx0, gy0, gx1 + 1, m.h] };
    }
    // Distance along the path to the exit, on a 1/4 grid (BFS through black pixels) → progress for O8.
    function buildDist(P) {
      dw = Math.ceil(wall.w / DS); dh = Math.ceil(wall.h / DS);
      dist = new Int32Array(dw * dh).fill(-1);
      var open = new Uint8Array(dw * dh);
      for (var y = 0; y < dh; y++) for (var x = 0; x < dw; x++)
        open[y * dw + x] = wall.px[Math.min(wall.h - 1, y * DS + 2) * wall.w + Math.min(wall.w - 1, x * DS + 2)];
      var q = new Int32Array(dw * dh), qh = 0, qt = 0;
      var s0 = Math.round(P.exit[1] / DS) * dw + Math.round(P.exit[0] / DS);
      dist[s0] = 0; q[qt++] = s0;
      while (qh < qt) {
        var i = q[qh++], x = i % dw, yy = (i - x) / dw;
        [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(function (d) {
          var a = x + d[0], b = yy + d[1];
          if (a < 0 || b < 0 || a >= dw || b >= dh) return;
          var j = b * dw + a;
          if (open[j] && dist[j] < 0) { dist[j] = dist[i] + 1; q[qt++] = j; }
        });
      }
      startDist = Math.max(1, distAt(P.start[0], P.start[1]));
    }
    function distAt(x, y) {
      var v = dist[Math.round(y / DS) * dw + Math.round(x / DS)];
      return v === undefined ? -1 : v;
    }
    function isPath(x, y) {
      x = Math.round(x); y = Math.round(y);
      if (x < 0 || y < 0 || x >= wall.w || y >= wall.h) return false;
      return wall.px[y * wall.w + x] === 1;
    }
    // The bone touches a wall if any point of its rim is off the path.
    function boneHitsWall(x, y) {
      for (var a = 0; a < 24; a++) {
        var t = a / 24 * Math.PI * 2;
        if (!isPath(x + Math.cos(t) * tool.r, y + Math.sin(t) * tool.r)) return true;
      }
      return false;
    }

    function loadImg(src) {
      return new Promise(function (ok, ko) { var i = new Image(); i.onload = function () { ok(i); }; i.onerror = ko; i.src = src; });
    }
    function preparePath() {
      var P = PATHS[pathIdx];
      artEl.src = P.art;
      document.getElementById('fill').style.backgroundImage = 'url("' + P.art + '")';
      return Promise.all([loadImg(P.mask), tool ? null : loadImg(TOOL.mask)]).then(function (r) {
        wall = maskData(r[0]); artH = wall.h * ART_W / wall.w;
        if (r[1]) tool = readTool(r[1]);
        toolEl.src = TOOL.art; toolEl.style.width = tool.w + 'px'; toolEl.style.height = tool.h + 'px';
        artEl.style.width = ART_W + 'px'; artEl.style.height = artH + 'px';
        buildDist(P);
      });
    }

    // The art fills the width (as in Figma); on short screens it shrinks so the path and the tool fit.
    function layout() {
      var r = stage.getBoundingClientRect();
      k = Math.min(r.width / ART_W, r.height / CFG.FIT_H);
      boardEl.style.width = ART_W + 'px'; boardEl.style.height = artH + 'px';
      boardEl.style.transform = 'translateX(' + (-ART_W * k / 2) + 'px) scale(' + k + ')';
    }
    function drawTool() {
      toolEl.style.transform = 'translate(' + (bone.x - tool.cx) + 'px,' + (bone.y - tool.cy) + 'px)';
    }

    // ── HUD ──
    function hud() {
      document.getElementById('touches').textContent = touches + (touches === 1 ? ' touch' : ' touches');
      timer.set(Math.min(1, clock.ms() / PATHS[pathIdx].slow), (clock.ms() / 1000).toFixed(1), 's');
    }

    // ── Round ──
    function newRound() {
      order = HG.shuffle(players); turn = 0; results = []; committed = false;
      if (!pinned) {
        var next; do { next = Math.floor(Math.random() * PATHS.length); } while (PATHS.length > 1 && next === pathIdx);
        pathIdx = next;               // same path + bone for everyone; Play again = a new one
      }
      preparePath().then(showUpNext);
    }
    function showUpNext() {
      phase = 'idle'; screen('upnext');
      var c = document.getElementById('upnext');
      HG.shell.upNext(c, order, turn, startTurn);
      if (CFG.TEST_PICKER) c.insertBefore(testPicker(), c.firstChild);
    }
    // Hitbox test only: choose the path to try. Changes it for the rest of the round too.
    function testPicker() {
      var row = el('div', 'testpick');
      row.appendChild(el('span', null, 'Hitbox test'));
      PATHS.forEach(function (P, i) {
        var b = el('button', i === pathIdx ? 'on' : null, P.test);
        tap(b, function () {
          if (switching || i === pathIdx) { pinned = true; return; }
          switching = true; pinned = true; pathIdx = i;
          preparePath().then(function () { switching = false; showUpNext(); });
        });
        row.appendChild(b);
      });
      return row;
    }

    // ── O1 · Pick up the tool ──
    function startTurn() {
      turnStarted = true;
      phase = 'ready'; touches = 0; maxProg = 0; trackId = null; picked = false;
      clock = HG.Clock();
      document.getElementById('who').textContent = order[turn];
      document.getElementById('pathname').textContent = PATHS[pathIdx].name;
      screen('play');
      layout();
      bone = { x: PATHS[pathIdx].start[0], y: PATHS[pathIdx].start[1] };
      trail = [bone];
      drawTool(); boardEl.classList.add('ready');
      hud();
    }

    // ── Touch (only the finger that picked up the tool counts) ──
    function local(t) {
      var r = boardEl.getBoundingClientRect();
      return { x: (t.clientX - r.left) / k, y: (t.clientY - r.top) / k };
    }
    function onGrip(p) {
      var g = tool.grip, s = CFG.GRIP_SLOP / k;
      var x = p.x - (bone.x - tool.cx), y = p.y - (bone.y - tool.cy);   // in tool pixels
      return x >= g[0] - s && x <= g[2] + s && y >= g[1] - s && y <= g[3] + s;
    }

    stage.addEventListener('touchstart', function (e) {
      e.preventDefault();
      if (phase !== 'ready' || HG.shell.isPaused()) return;
      for (var i = 0; i < e.changedTouches.length; i++) {
        var t = e.changedTouches[i], p = local(t);
        if (!onGrip(p)) continue;                                    // anywhere else does nothing
        trackId = t.identifier;
        offX = bone.x - p.x; offY = bone.y - p.y;                    // the bone keeps its place above the finger
        picked = true; phase = 'run';
        boardEl.classList.remove('ready');
        if (clock.ms() === 0 && !clock.running()) clock.start(); else clock.resume();   // timer starts on pick-up
        clearInterval(hudTimer); hudTimer = setInterval(hud, 100);
        HG.play('tick');
        return;
      }
    }, { passive: false });

    stage.addEventListener('touchmove', function (e) {
      e.preventDefault();
      if (phase !== 'run' || HG.shell.isPaused()) return;
      for (var i = 0; i < e.changedTouches.length; i++) {
        var t = e.changedTouches[i];
        if (t.identifier !== trackId) continue;
        var p = local(t), to = { x: p.x + offX, y: p.y + offY };
        // Walk the move in small steps so a fast swipe can't jump over a wall.
        var n = Math.max(1, Math.ceil(Math.hypot(to.x - bone.x, to.y - bone.y) / CFG.STEP)), from = bone;
        for (var s = 1; s <= n; s++) {
          bone = { x: from.x + (to.x - from.x) * s / n, y: from.y + (to.y - from.y) * s / n };
          if (boneHitsWall(bone.x, bone.y)) return wallTouch();
          safeSpot();
          var ex = PATHS[pathIdx].exit;
          if (Math.hypot(bone.x - ex[0], bone.y - ex[1]) < CFG.EXIT_R) { drawTool(); return boneOut(); }
        }
        drawTool();
      }
    }, { passive: false });

    // Bone is clear of the walls here: remember the spot and count the progress.
    function safeSpot() {
      trail.push(bone); if (trail.length > 40) trail.shift();
      var d = distAt(bone.x, bone.y);
      if (d >= 0) maxProg = Math.max(maxProg, Math.min(1, 1 - d / startDist));
    }

    function onEnd(e) {
      e.preventDefault();
      // A touch-end caused by Pause, the Quit popup or an interruption is not a lift.
      if (phase !== 'run' || HG.shell.isPaused()) return;
      for (var i = 0; i < e.changedTouches.length; i++)
        if (e.changedTouches[i].identifier === trackId) return fingerLifted();
    }
    stage.addEventListener('touchend', onEnd, { passive: false });
    stage.addEventListener('touchcancel', onEnd, { passive: false });

    // ── O6 · BZZT! Walls can't be crossed: the tweezers drop back along the trail and must be picked up again.
    //    The timer keeps running, so every touch costs time as well as precision points. ──
    var bz = document.getElementById('bzzt'), bzT = null;
    function wallTouch() {
      touches++;
      HG.feedback('buzz', stage);
      bz.classList.add('on'); clearTimeout(bzT); bzT = setTimeout(function () { bz.classList.remove('on'); }, 450);
      var hitAt = bone, i = trail.length - 1;
      while (i > 0 && Math.hypot(trail[i].x - hitAt.x, trail[i].y - hitAt.y) < CFG.SNAP_BACK) i--;
      bone = trail[i]; trail.length = i + 1;
      drawTool();
      trackId = null; phase = 'ready'; boardEl.classList.add('ready');
      hud();
    }

    function endRun() {
      clock.stop(); clearInterval(hudTimer); hud();
      phase = 'over'; trackId = null;
    }
    function breakdown(ms, t) {
      var P = PATHS[pathIdx];
      var spd = 30 * HG.speed(ms, P.par, P.slow), prec = Math.max(0, 20 - 5 * t);
      return { speed: spd, prec: prec, total: 50 + spd + prec };
    }

    // ── O4 · Bone out ──
    function boneOut() {
      endRun();
      var ms = clock.ms(), b = breakdown(ms, touches);
      results.push({ name: order[turn], out: true, ms: ms, touches: touches, pts: b.total, seq: turn });
      HG.play('success'); HG.confetti();
      var c = turnEnd('Bone out!', Math.round(b.total));
      var bd = el('div', 'breakdown');
      [['Bone out', '50'], ['Speed (' + HG.fmtSec(ms) + ')', '+ ' + Math.round(b.speed)],
       ['Precision (' + touches + ' wall touch' + (touches === 1 ? '' : 'es') + ')', '+ ' + Math.round(b.prec)]].forEach(function (l, i) {
        var row = el('div'); row.appendChild(el('span', null, l[0])); row.appendChild(el('b', null, l[1])); bd.appendChild(row);
        setTimeout(function () { row.classList.add('in'); }, 250 * (i + 1));   // lines animate in one by one
      });
      c.insertBefore(bd, c.querySelector('.hg-btn'));
    }

    // ── O8 · Turn lost · finger lifted ──
    function fingerLifted() {
      endRun();
      var pts40 = maxProg * 40;
      results.push({ name: order[turn], out: false, ms: clock.ms(), touches: touches, prog: maxProg, pts: pts40, seq: turn });
      HG.play('fail');
      turnEnd('Finger lifted!', Math.round(pts40), 'So close! You got ' + Math.round(maxProg * 100) + ' % of the way');
    }

    function turnEnd(title, pts, sub) {
      var c = document.getElementById('turnend'); clear(c);
      c.classList.toggle('lifted', !!sub);
      c.appendChild(el('div', 'shout', title));
      if (sub) c.appendChild(el('div', 'note', sub));
      var panel = el('div', 'hg-score');
      panel.appendChild(el('div', 'hg-score-label', 'Score:'));
      var v = el('div', 'hg-score-val', String(pts)); v.appendChild(el('small', null, 'pts')); panel.appendChild(v);
      c.appendChild(panel);
      var cta = btn(HG.t('next'), 'hg-btn-primary', function () {
        if (cta.disabled) return;
        turnStarted = false;
        showResults();
      });
      cta.disabled = true; setTimeout(function () { cta.disabled = false; }, CFG.CTA_DELAY);
      c.appendChild(cta);
      setTimeout(function () { screen('turnend'); }, 250);
      return c;
    }

    // ── O5 · Round results: after every turn (players still to play keep an empty badge);
    //    after the last turn the scores are committed and NEXT goes to the leaderboard (G3). ──
    function showResults() {
      phase = 'idle';
      var last = turn === order.length - 1;
      var pts = {};
      results.forEach(function (r) { pts[r.name] = r.pts; });
      if (last && !committed) { HG.commitRound('operation', pts); committed = true; }
      var c = document.getElementById('results'); clear(c);
      c.appendChild(el('div', 'hg-titlebar', 'Round results'));
      var list = el('div', 'hg-ranks'); c.appendChild(list);
      HG.rank(results, function (a, b) { return b.pts - a.pts; }).forEach(function (r) {
        list.appendChild(HG.rankRow(r.place, r.item.name, [['b', String(Math.round(r.item.pts))], ['w', 'pts']]));
      });
      order.slice(turn + 1).forEach(function (n) { list.appendChild(HG.rankRow(null, n, null)); });
      if (last) c.appendChild(btn(HG.t('next'), 'hg-btn-primary', showLeaderboard));
      else { turn++; c.appendChild(btn(HG.t('next'), 'hg-btn-primary', showUpNext)); }
      screen('results');
    }
    function showLeaderboard() { screen('lb'); HG.shell.leaderboard(document.getElementById('lb'), newRound); }

    // ── Shell ──
    HG.shell.init({
      game: 'operation',
      logo: '../../assets/ui/logo-operation.webp',
      tip: 'The timer only starts when you touch the tweezers. Take your time to aim!',
      howTo: {
        lines: ['Touch the tweezers to start', 'Slide along the path', "Touch a wall: BZZT! The tweezers jump back", 'Carry the bone out', "Don't lift your finger!", 'Bone out + speed score points'],
        cta: 'Got it'
      },
      currentPlayer: function () { return order[turn]; },
      hasProgress: function () { return !committed && (turn > 0 || turnStarted || results.length > 0); },
      onPause: function () {
        // The tool stays where it is; the run and the timer carry on when the player picks it up again.
        if (phase === 'run') { clock.pause(); clearInterval(hudTimer); trackId = null; phase = 'ready'; boardEl.classList.add('ready'); }
      },
      onResume: function () {}
    });

    window.addEventListener('resize', function () {
      if (document.getElementById('play').classList.contains('active')) layout();
    });

    players = HG.getPlayers();
    if (!players.length) players = ['Player 1'];
    var preload = ['../../assets/ui/logo-operation.webp', 'assets/bg-pattern.webp', TOOL.art, TOOL.mask];
    PATHS.forEach(function (P) { preload.push(P.art, P.mask); });
    HG.shell.begin(preload, newRound);
  </script>
</body>
</html>
