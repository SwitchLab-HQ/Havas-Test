<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
  <title>Operation — The Mini Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alan+Sans:wght@900&family=Inter+Tight:wght@400;500;700;900&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared.css">
  <style>
    /* Operation · logic: wireframes board 06 (65:316) · look: Design UI section OPERATION (283:2846), Operation_00–07. */
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
    html, body { width:100%; height:100%; overflow:hidden; color:var(--dark-blue); }
    .screen { display:none; position:absolute; inset:0; flex-direction:column; align-items:center; }
    .screen.active { display:flex; }
    .stack { justify-content:center; gap:16px; padding:20px 20px 24px; text-align:center; }
    .stack > .hg-btn:first-of-type { margin-top:auto; }
    .note { font-family:var(--f-body); font-weight:700; font-size:14px; line-height:20px; color:var(--dark-blue); text-align:center; }

    /* O1 / O2 / O6 */
    #play { padding:15px 20px 12px; gap:8px; }
    .hg-banner-body { right:90px; gap:9px; }
    .touches { align-self:flex-start; font-family:var(--f-body); font-weight:700; font-size:11px; color:#fff; background:var(--dark-blue); padding:5px 10px; border-radius:12px; }
    .boardwrap { --s: min(350px, 92vw, calc(100vh - 44px - 15px - 121px - 8px - 130px)); width:var(--s); height:var(--s); position:relative; flex-shrink:0; border-radius:calc(var(--s) * 0.0914); background:#fff; }
    .boardwrap .art { position:absolute; inset:3.43%; border-radius:calc(var(--s) * 0.063); background:#d5d9df; }
    canvas { position:absolute; left:0; top:0; width:100%; height:calc(100% + 76px); display:block; touch-action:none; z-index:2; }
    .tipline { min-height:40px; padding:0 20px; margin-top:66px; }
    /* BZZT! (O6): whole screen goes orange for a moment */
    .bzzt { position:fixed; inset:0; z-index:40; display:none; flex-direction:column; align-items:center; justify-content:center; gap:12px; pointer-events:none;
      background:rgba(246,138,30,0.82); }
    .bzzt.on { display:flex; }
    .bzzt .hg-title { font-size:84px; color:#fff; -webkit-text-stroke:10px var(--dark-blue); paint-order:stroke fill; }
    .minus { font-family:var(--f-display); font-weight:900; font-size:24px; color:#fff; background:var(--dark-blue); padding:8px 18px; border-radius:24px; }

    /* O4 / O8 */
    .breakdown { width:100%; max-width:352px; background:#fff; border-radius:26px; padding:12px 18px; display:flex; flex-direction:column; gap:6px; }
    .breakdown div { display:flex; justify-content:space-between; font-family:var(--f-body); font-size:13px; opacity:0; transform:translateY(6px); transition:opacity .3s, transform .3s; }
    .breakdown div.in { opacity:1; transform:none; }
    .breakdown b { font-family:var(--f-body); font-weight:900; }
    .lifted-art { width:120px; height:120px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; font-size:64px; }
    .shout { font-family:var(--f-display); font-weight:900; font-size:40px; line-height:1.05; color:#fff; text-transform:uppercase;
      -webkit-text-stroke:8px var(--dark-blue); paint-order:stroke fill; }
  </style>
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KTRVRJ5D"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->
  <div class="hg-body">
    <div id="upnext" class="screen stack hg-scroll"></div>

    <div id="play" class="screen">
      <div class="hg-banner">
        <div class="hg-banner-bg"></div>
        <div class="hg-tag"><div class="hg-tag-name" id="who"></div></div>
        <div class="hg-banner-body">
          <div class="hg-banner-title" id="pathname"></div>
          <div class="touches" id="touches">0 touches</div>
        </div>
        <div class="hg-banner-right" id="timerslot"></div>
      </div>
      <div class="boardwrap" id="boardwrap"><div class="art"></div><canvas id="cv"></canvas></div>
      <div class="note tipline" id="tipline">Put your finger on the tweezers handle. The timer starts then</div>
    </div>

    <div id="turnend" class="screen stack"></div>   <!-- O4 / O8 -->
    <div id="results" class="screen stack hg-scroll"></div>
    <div id="lb" class="screen stack hg-scroll"></div>
  </div>
  <div class="bzzt" id="bzzt"><div class="hg-title">BZZT!</div><div class="minus">−5 pts</div></div>

  <script src="../../shared.js"></script>
  <script>
    // ── Paths: SVG path data in board units (350 × 350, the Figma board). The tool starts at the
    //    path start and goes up first (the ring is held 60 px above the finger).
    //    Funny Bone = Figma Operation_02. Par / slow per path from playtests: placeholders. ──
    var PATHS = [
      { name: 'Funny Bone', halfW: 15, par: 7000, slow: 28000,
        d: 'M60 290 V175 C60 128.3 130 128.3 130 175 V255 C130 301.7 200 301.7 200 255 V95 C200 48.3 270 48.3 270 95 V170' },
      { name: 'Wrist Bone', halfW: 17, par: 6000, slow: 25000,
        d: 'M70 290 V185 H170 V95 H280 V180' },
      { name: 'Spare Ribs', halfW: 15, par: 8000, slow: 30000,
        d: 'M60 290 V95 H130 V255 H200 V95 H275 V190' }
    ];
    var B = 350;                // board units
    var CFG = {
      GRIP_OFFSET: 60,          // clamp grip: the ring sits 60 px above the finger
      RING_R: 9,                // ring drawn
      HIT_R: 5,                 // ring tested against the walls
      PAD_R: 28,                // start pad (TOUCH HERE)
      GRACE_MS: 500,            // wall debounce
      CTA_DELAY: 800
    };
    var el = HG.el, clear = HG.clear, tap = HG.onTap;

    // ── Round state ──
    var players = [], order = [], turn = 0, results = [], pathIdx = -1, committed = false;
    // ── Turn state ──
    var phase = 'idle';   // idle | ready (O1, waiting for pick-up) | run (O2) | over
    var touches = 0, inWall = false, graceUntil = 0, maxProg = 0, firstPickup = true, picked = false;
    var trackId = null, ring = { x: 0, y: 0 }, finger = null, offX = 0, offY = 0;
    var clock = HG.Clock(), hudTimer = null, raf = null, turnStarted = false;
    var timer = HG.timerRing(); document.getElementById('timerslot').appendChild(timer.el);

    // ── Geometry ──
    var cv = document.getElementById('cv'), ctx = cv.getContext('2d'), wrap = document.getElementById('boardwrap');
    var k = 1, path2d = null, samples = [], total = 0, startPt, exitPt;

    function screen(id) {
      document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('active'); });
      document.getElementById(id).classList.add('active');
    }
    function btn(text, cls, fn) { var b = el('button', 'hg-btn ' + cls, text); tap(b, fn); return b; }

    function preparePath() {
      var P = PATHS[pathIdx];
      path2d = new Path2D(P.d);
      var svgp = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      svgp.setAttribute('d', P.d);
      total = svgp.getTotalLength();
      samples = [];
      for (var l = 0; l <= total; l += 2) { var p = svgp.getPointAtLength(l); samples.push({ x: p.x, y: p.y, l: l }); }
      var e = svgp.getPointAtLength(total); samples.push({ x: e.x, y: e.y, l: total });
      startPt = samples[0]; exitPt = samples[samples.length - 1];
    }
    function layout() {
      var r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
      cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
      k = r.width / B;                                   // CSS px per board unit
      ctx.setTransform(dpr * k, 0, 0, dpr * k, 0, 0);    // draw in board units
    }
    // Nearest point on the path: distance (board units) + progress (0–1)
    function nearest(x, y) {
      var best = Infinity, at = 0;
      for (var i = 0; i < samples.length; i++) {
        var dx = samples[i].x - x, dy = samples[i].y - y, d = dx * dx + dy * dy;
        if (d < best) { best = d; at = samples[i].l; }
      }
      return { d: Math.sqrt(best), prog: total ? at / total : 0 };
    }

    // ── Drawing (board units) ──
    function draw(now) {
      ctx.clearRect(0, 0, B, B + 120);
      var P = PATHS[pathIdx];
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.strokeStyle = '#001f3b'; ctx.lineWidth = P.halfW * 2 + 10; ctx.stroke(path2d);   // walls
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = P.halfW * 2; ctx.stroke(path2d);        // corridor
      // EXIT (bone exit)
      roundRect(exitPt.x - 32, exitPt.y - 12, 64, 32, 16);
      ctx.fillStyle = '#d5d9df'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#001f3b'; ctx.stroke();
      ctx.fillStyle = '#001f3b'; ctx.font = '900 11px "Alan Sans", Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('EXIT', exitPt.x, exitPt.y + 4);
      // Tweezers: handle (TOUCH HERE) 60 px under the ring, so the finger never hides the start dot.
      if (phase === 'ready') {
        var g = grip();
        drawTweezers(g.x, g.y);
        var pulse = 1 + 0.15 * Math.sin((now || 0) / 200);
        ctx.fillStyle = 'rgba(78,198,224,0.4)'; ctx.beginPath(); ctx.arc(g.x, g.y, 34 * pulse, 0, 7); ctx.fill();
        ctx.fillStyle = '#4ec6e0'; ctx.strokeStyle = '#001f3b'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(g.x, g.y, CFG.PAD_R, 0, 7); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#001f3b'; ctx.font = '900 9px "Alan Sans", Arial';
        ctx.fillText('TOUCH', g.x, g.y - 5); ctx.fillText('HERE', g.x, g.y + 6);
        drawRing();
      }
      if (phase !== 'ready' && picked) drawTool();
    }
    function grip() { return { x: ring.x, y: ring.y + CFG.GRIP_OFFSET / k }; }
    // Two arms from the handle up to the tips, which hold the ring (tool = bone).
    function drawTweezers(hx, hy) {
      ctx.lineCap = 'round';
      [[-1], [1]].forEach(function (sd) {
        ctx.strokeStyle = '#001f3b'; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.moveTo(hx + sd[0] * 8, hy - 6); ctx.lineTo(ring.x + sd[0] * (CFG.RING_R - 2), ring.y + 4); ctx.stroke();
        ctx.strokeStyle = '#cfd6de'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(hx + sd[0] * 8, hy - 6); ctx.lineTo(ring.x + sd[0] * (CFG.RING_R - 2), ring.y + 4); ctx.stroke();
      });
    }
    function drawRing() {
      ctx.fillStyle = '#fff'; ctx.strokeStyle = inWall ? '#ea3557' : '#001f3b'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(ring.x, ring.y, CFG.RING_R, 0, 7); ctx.fill(); ctx.stroke();
    }
    function roundRect(x, y, w, h, r) {
      ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
    }
    function drawTool() {
      if (finger) {
        drawTweezers(finger.x, finger.y);
        ctx.fillStyle = 'rgba(0,31,59,0.22)'; ctx.beginPath(); ctx.arc(finger.x, finger.y, 18, 0, 7); ctx.fill();
      }
      drawRing();
    }
    function loop(now) { draw(now); raf = phase === 'ready' ? requestAnimationFrame(loop) : null; }
    function startLoop() { if (!raf) raf = requestAnimationFrame(loop); }

    // ── HUD ──
    function hud() {
      document.getElementById('touches').textContent = touches + (touches === 1 ? ' touch' : ' touches');
      timer.set(Math.min(1, clock.ms() / PATHS[pathIdx].slow), (clock.ms() / 1000).toFixed(1), 's');
    }

    // ── Round ──
    function newRound() {
      order = HG.shuffle(players); turn = 0; results = []; committed = false;
      var next; do { next = Math.floor(Math.random() * PATHS.length); } while (PATHS.length > 1 && next === pathIdx);
      pathIdx = next;                 // same path + bone for everyone; Play again = a new one
      preparePath();
      firstPickup = true;
      showUpNext();
    }
    function showUpNext() {
      phase = 'idle'; screen('upnext');
      HG.shell.upNext(document.getElementById('upnext'), order, turn, startTurn);
    }

    // ── O1 · Pick up the tool ──
    function startTurn() {
      turnStarted = true;
      phase = 'ready'; touches = 0; inWall = false; graceUntil = 0; maxProg = 0; trackId = null; picked = false; finger = null;
      clock = HG.Clock();
      document.getElementById('who').textContent = order[turn];
      document.getElementById('pathname').textContent = PATHS[pathIdx].name;
      document.getElementById('tipline').style.visibility = firstPickup ? '' : 'hidden';
      screen('play');
      layout();
      ring = { x: startPt.x, y: startPt.y };
      hud(); startLoop();
    }

    // ── Touch (only the finger that picked up the tool counts) ──
    function local(t) { var r = cv.getBoundingClientRect(); return { x: (t.clientX - r.left) / k, y: (t.clientY - r.top) / k }; }

    cv.addEventListener('touchstart', function (e) {
      e.preventDefault();
      if (phase !== 'ready' || HG.shell.isPaused()) return;
      for (var i = 0; i < e.changedTouches.length; i++) {
        var t = e.changedTouches[i], p = local(t);
        var g = grip();
        if (Math.hypot(p.x - g.x, p.y - g.y) > CFG.PAD_R + 14) continue;      // anywhere else does nothing
        trackId = t.identifier;
        finger = p;
        offX = ring.x - p.x; offY = ring.y - p.y;                            // clamp grip: ring stays above the finger
        picked = true; phase = 'run';
        firstPickup = false;
        document.getElementById('tipline').style.visibility = 'hidden';
        if (clock.ms() === 0 && !clock.running()) clock.start(); else clock.resume();   // timer starts on pick-up
        clearInterval(hudTimer); hudTimer = setInterval(hud, 100);
        HG.play('tick');
        checkWalls(); draw();
        return;
      }
    }, { passive: false });

    cv.addEventListener('touchmove', function (e) {
      e.preventDefault();
      if (phase !== 'run' || HG.shell.isPaused()) return;
      for (var i = 0; i < e.changedTouches.length; i++) {
        var t = e.changedTouches[i];
        if (t.identifier !== trackId) continue;
        finger = local(t);
        ring = { x: finger.x + offX, y: finger.y + offY };
        checkWalls();
        if (Math.hypot(ring.x - exitPt.x, ring.y - exitPt.y) < 14) return boneOut();
        draw();
      }
    }, { passive: false });

    function checkWalls() {
      var n = nearest(ring.x, ring.y);
      var wall = n.d > PATHS[pathIdx].halfW - CFG.HIT_R;
      if (wall && !inWall && performance.now() >= graceUntil) wallTouch();
      inWall = wall;
      if (!wall) maxProg = Math.max(maxProg, n.prog);
    }

    function onEnd(e) {
      e.preventDefault();
      // A touch-end caused by Pause, the Quit popup or an interruption is not a lift.
      if (phase !== 'run' || HG.shell.isPaused()) return;
      for (var i = 0; i < e.changedTouches.length; i++)
        if (e.changedTouches[i].identifier === trackId) return fingerLifted();
    }
    cv.addEventListener('touchend', onEnd, { passive: false });
    cv.addEventListener('touchcancel', onEnd, { passive: false });

    // ── O6 · BZZT! ──
    var bz = document.getElementById('bzzt'), bzT = null;
    function wallTouch() {
      touches++;
      graceUntil = performance.now() + CFG.GRACE_MS;
      HG.feedback('buzz', wrap);
      bz.classList.add('on'); clearTimeout(bzT); bzT = setTimeout(function () { bz.classList.remove('on'); }, 450);
      hud();
    }

    function endRun() {
      clock.stop(); clearInterval(hudTimer); hud();
      phase = 'over'; trackId = null; finger = null; draw();
    }
    function breakdown(ms, t) {
      var P = PATHS[pathIdx];
      var spd = 30 * HG.speed(ms, P.par, P.slow), prec = Math.max(0, 20 - 5 * t);
      return { speed: spd, prec: prec, total: 50 + spd + prec };
    }

    // ── O4 · Bone out ──
    function boneOut() {
      endRun();
      var ms = clock.ms(), b = breakdown(ms, touches);
      results.push({ name: order[turn], out: true, ms: ms, touches: touches, pts: b.total, seq: turn });
      HG.play('success'); HG.confetti();
      var c = turnEnd('Bone out!', Math.round(b.total));
      var bd = el('div', 'breakdown');
      [['Bone out', '50'], ['Speed (' + HG.fmtSec(ms) + ')', '+ ' + Math.round(b.speed)],
       ['Precision (' + touches + ' wall touch' + (touches === 1 ? '' : 'es') + ')', '+ ' + Math.round(b.prec)]].forEach(function (l, i) {
        var row = el('div'); row.appendChild(el('span', null, l[0])); row.appendChild(el('b', null, l[1])); bd.appendChild(row);
        setTimeout(function () { row.classList.add('in'); }, 250 * (i + 1));   // lines animate in one by one
      });
      c.insertBefore(bd, c.querySelector('.hg-btn'));
    }

    // ── O8 · Turn lost · finger lifted ──
    function fingerLifted() {
      endRun();
      var pts40 = maxProg * 40;
      results.push({ name: order[turn], out: false, ms: clock.ms(), touches: touches, prog: maxProg, pts: pts40, seq: turn });
      HG.play('fail');
      var c = turnEnd('Finger lifted!', Math.round(pts40), 'So close! You got ' + Math.round(maxProg * 100) + ' % of the way');
      c.insertBefore(el('div', 'lifted-art', '☝'), c.firstChild);
    }

    function turnEnd(title, pts, sub) {
      var c = document.getElementById('turnend'); clear(c);
      c.appendChild(el('div', 'shout', title));
      if (sub) c.appendChild(el('div', 'note', sub));
      var panel = el('div', 'hg-score');
      panel.appendChild(el('div', 'hg-score-label', 'Score:'));
      var v = el('div', 'hg-score-val', String(pts)); v.appendChild(el('small', null, 'pts')); panel.appendChild(v);
      c.appendChild(panel);
      var last = turn === order.length - 1;
      var cta = btn(last ? 'See results' : 'Next: ' + order[turn + 1], 'hg-btn-primary', function () {
        if (cta.disabled) return;
        turnStarted = false; turn++;
        if (turn >= order.length) showResults(); else showUpNext();
      });
      cta.disabled = true; setTimeout(function () { cta.disabled = false; }, CFG.CTA_DELAY);
      c.appendChild(cta);
      setTimeout(function () { screen('turnend'); }, 250);
      return c;
    }

    // ── O5 · Round results (scores committed here) ──
    function showResults() {
      phase = 'idle';
      var pts = {};
      results.forEach(function (r) { pts[r.name] = r.pts; });
      if (!committed) { HG.commitRound('operation', pts); committed = true; }
      var c = document.getElementById('results'); clear(c);
      c.appendChild(el('div', 'hg-titlebar', 'Round results'));
      var list = el('div', 'hg-ranks'); c.appendChild(list);
      HG.rank(results, function (a, b) { return b.pts - a.pts; }).forEach(function (r) {
        var res = r.item;
        list.appendChild(HG.rankRow(r.place, res.name, [[null, res.out ? HG.fmtSec(res.ms) : 'Lifted'], ['b', String(Math.round(res.pts))], ['w', 'pts']]));
      });
      c.appendChild(btn('See leaderboard', 'hg-btn-primary', function () { screen('lb'); HG.shell.leaderboard(document.getElementById('lb'), newRound); }));
      c.appendChild(btn('Play again', 'hg-btn-ghost', newRound));
      screen('results');
    }

    // ── Shell ──
    HG.shell.init({
      game: 'operation',
      logo: '../../assets/ui/logo-operation.webp',
      tip: 'The timer only starts when you touch the tweezers. Take your time to aim!',
      howTo: {
        lines: ['Touch the tweezers to start', 'Slide along the path', "Don't touch the walls!", 'Carry the bone out', "Don't lift your finger!", 'Bone out + speed score points'],
        cta: 'Got it'
      },
      currentPlayer: function () { return order[turn]; },
      hasProgress: function () { return !committed && (turn > 0 || turnStarted); },
      onPause: function () {
        // The tool stays where it is; the run and the timer carry on when the player picks it up again.
        if (phase === 'run') { clock.pause(); clearInterval(hudTimer); trackId = null; finger = null; phase = 'ready'; inWall = false; }
        if (raf) { cancelAnimationFrame(raf); raf = null; }
      },
      onResume: function () { if (phase === 'ready') startLoop(); }
    });

    window.addEventListener('resize', function () {
      if (!document.getElementById('play').classList.contains('active')) return;
      layout(); draw();
    });

    players = HG.getPlayers();
    if (!players.length) players = ['Player 1'];
    HG.shell.begin(['../../assets/ui/logo-operation.webp', 'assets/bg-pattern.webp'], newRound);
  </script>
</body>
</html>
