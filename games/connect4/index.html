<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
  <title>Connect 4 — The Mini Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alan+Sans:wght@900&family=Inter+Tight:wght@400;500;700;900&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared.css">
  <style>
    /* Connect 4 · logic: 0. Claude/Connect4_Wireframe_Brief.md (v03, one round, everyone plays once)
       · look: Design UI - 02 section CONNECT 4 (268:2036), Connect4_00–09. */
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
    html, body { width:100%; height:100%; overflow:hidden; color:#fff; }
    .screen { display:none; position:absolute; inset:0; flex-direction:column; align-items:center; }
    .screen.active { display:flex; }
    .stack { justify-content:center; gap:16px; padding:22px 20px 24px; text-align:center; }
    .stack > .hg-btn:first-of-type { margin-top:auto; }
    .tok { width:44px; height:44px; display:block; }
    .note { font-family:var(--f-body); font-size:14px; color:#fff; }
    .shout { font-family:var(--f-display); font-weight:900; font-size:30px; line-height:1.1; color:#fff; text-transform:uppercase;
      -webkit-text-stroke:6px var(--dark-blue); paint-order:stroke fill; }
    .shout.xl { font-size:42px; -webkit-text-stroke:8px var(--dark-blue); }

    /* C1 Matches · C5 Next up: white card, "Match N" label over a dark pill */
    .mcard { width:100%; max-width:315px; background:#fff; border-radius:32px; padding:24px 16px 20px; display:flex; flex-direction:column; gap:18px; text-align:left; }
    .mcard-title { font-family:var(--f-display); font-weight:900; font-size:32px; line-height:26px; color:var(--dark-blue); text-transform:uppercase; padding-top:2px; }
    .mitem { display:flex; flex-direction:column; gap:6px; }
    .mlabel { font-family:var(--f-ui); font-weight:700; font-size:13px; color:var(--dark-blue); text-align:center; }
    .match { display:flex; align-items:center; gap:8px; height:39px; padding:0 16px; border-radius:20px; background:var(--dark-blue); color:#fff; }
    .match .n { flex:1; min-width:0; font-family:var(--f-display); font-weight:900; font-size:18px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .match .n.r { text-align:right; }
    .match .v { font-family:var(--f-ui); font-size:11px; color:var(--light-blue); }
    .mcard.shuffling .n { opacity:0.5; }

    /* C2 Next match */
    .hg-pill { margin-top:60px; }
    .vs { display:flex; align-items:flex-start; justify-content:center; gap:10px; width:100%; max-width:352px; margin-top:20px; }
    .side { flex:1; display:flex; flex-direction:column; align-items:center; gap:10px; min-width:0; }
    .side .coin { width:120px; height:120px; display:block; }
    /* CN4-01: name pill with the player's monster at its outer end (mirrored on the right) */
    .ntag { display:flex; align-items:center; max-width:calc(100% + 20px); }   /* may reach under the VS gap, not past the coins' outer edge */
    .ntag .hg-avatar { width:38px; height:38px; border-radius:12px; position:relative; z-index:1; }
    .ntag b { min-width:0; height:28px; line-height:28px; margin-left:-12px; padding:0 12px 0 20px; border-radius:14px; background:var(--dark-blue); color:#fff;
      font-family:var(--f-display); font-weight:900; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .ntag.r { flex-direction:row-reverse; }
    .ntag.r b { margin:0 -12px 0 0; padding:0 20px 0 12px; }
    .vs-x { font-family:var(--f-display); font-weight:900; font-size:34px; color:#fff; -webkit-text-stroke:6px var(--dark-blue); paint-order:stroke fill; margin-top:44px; }
    #next .shout { margin-top:30px; }

    /* C3 Match: players row, turn banner, board */
    #match { padding:21px 12px 0; }
    .players { width:100%; max-width:366px; display:flex; align-items:center; justify-content:space-between; gap:6px; flex-shrink:0; }
    .ptag { width:144px; min-width:0; display:flex; align-items:center; justify-content:space-between; gap:6px; height:38px; padding:4px 4px 4px 12px; border-radius:32px;
      background:var(--dark-blue); border:4px solid transparent; opacity:0.6; transition:opacity .2s, border-color .2s; }
    .ptag.r { flex-direction:row-reverse; padding:4px 12px 4px 4px; }
    .ptag b { font-family:var(--f-display); font-weight:900; font-size:18px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
    .ptag img { width:22px; height:22px; flex-shrink:0; }
    .ptag.on { opacity:1; }
    .ptag.on.y { border-color:var(--yellow); }
    .ptag.on.rd { border-color:var(--red); }
    .mid { display:flex; flex-direction:column; align-items:center; flex-shrink:0; }
    .mid .vsx { font-family:var(--f-display); font-weight:900; font-size:22px; color:#fff; background:var(--dark-blue); border-radius:16px; padding:2px 8px; }
    .mid .lbl { font-family:var(--f-display); font-weight:900; font-size:13px; margin-top:4px; white-space:nowrap; }
    .turnbar { width:100%; max-width:366px; min-height:46px; margin-top:12px; flex-shrink:0; border-radius:32px; background:var(--dark-blue); border:4px solid transparent;
      display:flex; align-items:center; justify-content:center; gap:20px; padding:4px 16px; font-family:var(--f-display); font-weight:900; font-size:18px; text-transform:uppercase; }
    .turnbar svg { width:31px; height:22px; flex-shrink:0; }
    .turnbar.y { border-color:var(--yellow); } .turnbar.y svg { color:var(--yellow); transform:scaleX(-1); }
    .turnbar.rd { border-color:var(--red); } .turnbar.rd svg { color:var(--red); }
    .turnbar .sp { width:31px; flex-shrink:0; }
    .turnbar.big { min-height:73px; font-size:22px; }
    .boardbox { flex:1; width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; touch-action:none; min-height:0; }
    .boardinner { --w: min(356px, 92vw, calc((100vh - 290px) * 356 / 362)); width:var(--w); position:relative; }
    .ghostrow { position:relative; height:calc(var(--w) * 54 / 356); }
    .ghost { position:absolute; top:0; width:calc(var(--w) * 48 / 356); height:calc(var(--w) * 48 / 356); display:flex; align-items:center; justify-content:center; }
    .ghost img { width:100%; opacity:0.6; }
    .ghost.full img { opacity:1; width:62%; }
    .colhl { position:absolute; top:0; bottom:calc(var(--w) * 8 / 356); width:calc(var(--w) * 50 / 356); border-radius:26px; background:rgba(255,255,255,0.3); display:none; pointer-events:none; z-index:2; }
    .board { position:relative; width:var(--w); aspect-ratio:356 / 308; background:url('assets/board.svg') center / 100% 100% no-repeat; }
    .cell { position:absolute; width:calc(var(--w) * 46 / 356); height:calc(var(--w) * 46 / 356); transform:translate(-50%, -50%); border-radius:50%; }
    .cell img { width:100%; height:100%; display:block; pointer-events:none; }
    .cell img.falling { animation:fall var(--dur) cubic-bezier(0.5,0,0.75,0.4) both; }
    @keyframes fall { from { transform:translateY(var(--from)); } to { transform:translateY(0); } }
    .board.dim .cell img { opacity:0.35; }
    .board.dim .cell.win img { opacity:1; }
    .board.dim .cell.win { box-shadow:0 0 0 4px var(--wc, #fff); animation:win 0.6s ease-in-out infinite alternate; }
    @keyframes win { from { transform:translate(-50%, -50%) scale(1); } to { transform:translate(-50%, -50%) scale(1.1); } }
    .boardnote { font-family:var(--f-ui); font-size:14px; color:#fff; margin:14px 0 20px; min-height:18px; }

    /* C5 Match result */
    #won { justify-content:flex-start; padding-top:56px; }
    .scores { width:100%; max-width:299px; display:flex; flex-direction:column; gap:8px; margin-top:18px; }
    .scores .hg-tag { width:100%; padding:8px 16px 8px 8px; }
    .scores .hg-tag .hg-tag-txt { flex:1; }
    .scores .hg-tag-name { font-size:26px; }
    .scores .plus { font-family:var(--f-ui); font-weight:900; font-size:16px; white-space:nowrap; }
    .scores .plus small { font-weight:400; font-size:11px; margin-left:4px; }
    #won .mcard { margin-top:auto; }
    #won .mcard + .hg-btn { margin-top:24px; }
  </style>

<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KTRVRJ5D"

  <div class="hg-body">
    <div id="draw" class="screen stack hg-scroll"></div>      <!-- C1 -->
    <div id="next" class="screen stack"></div>                <!-- C2 -->
    <div id="match" class="screen">                           <!-- C3 / C3b / C4 / C10 -->
      <div class="players">
        <div class="ptag y" id="pY"></div>
        <div class="mid"><div class="vsx">VS</div><div class="lbl" id="mlabel"></div></div>
        <div class="ptag r rd" id="pR"></div>
      </div>
      <div class="turnbar" id="turnbar"></div>
      <div class="boardbox" id="boardbox">
        <div class="boardinner" id="boardinner">
          <div class="colhl" id="colhl"></div>
          <div class="ghostrow" id="ghostrow"></div>
          <div class="board" id="board"></div>
        </div>
        <div class="boardnote" id="boardnote"></div>
      </div>
    </div>
    <div id="won" class="screen stack hg-scroll"></div>       <!-- C5 / C8 -->
    <div id="lb" class="screen stack hg-scroll"></div>        <!-- G3 -->
  </div>

  <script src="../../shared.js"></script>
  <script>
    var COLS = 7, ROWS = 6;
    var Y = 1, R = 2;                       // Yellow always starts
    var IMG = { 1: 'assets/token-yellow.webp', 2: 'assets/token-red.webp' };
    var CPU = 'Computer';
    // Board art (assets/board.svg, 356 × 308): hole centres at 34 + 48 × n.
    var BW = 356, BH = 308, HOLE0 = 34, PITCH = 48;
    var ARROW = '<svg viewBox="0 0 31 22" aria-hidden="true"><path fill="currentColor" d="M17.59.88a3 3 0 0 0 0 4.24L20.53 8H3.07a3 3 0 1 0 0 6h17.46l-2.94 2.88a3 3 0 0 0 4.34 4.24l8.17-8a3 3 0 0 0 0-4.24l-8.17-8a3 3 0 0 0-4.34 0Z"/></svg>';
    var el = HG.el, clear = HG.clear, tap = HG.onTap;

    // ── Round state: random pairs, everyone plays exactly one match; the odd one out plays the computer ──
    var players = [], matches = [], mi = 0, results = {}, committed = false, anyDrop = false;
    // ── Match state ──
    var board = [], turnColor = Y, yellow = null, red = null, busy = false, over = false, moves = {};
    var aim = -1, aimPointer = null, cpuTimer = null, cpuInMatch = false;

    function screen(id) {
      document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('active'); });
      document.getElementById(id).classList.add('active');
    }
    function tok(color, cls) { var i = el('img', cls || 'tok'); i.src = IMG[color]; i.alt = color === Y ? 'Yellow' : 'Red'; return i; }
    function btn(text, cls, fn) { var b = el('button', 'hg-btn ' + cls, text); tap(b, fn); return b; }
    function matchLabel(i) { return 'Match ' + (i + 1) + ' of ' + matches.length; }

    // ── Start: random pairs = play order. 1 player → one match vs the computer ──
    function start() {
      players = HG.getPlayers(); if (!players.length) players = ['Player 1'];
      committed = false; anyDrop = false; results = {}; mi = 0;
      var d = HG.shuffle(players); matches = [];
      for (var i = 0; i < d.length; i += 2) matches.push({ a: d[i], b: d[i + 1] || CPU });
      if (players.length === 1) return showNext();
      showDraw();
    }

    function matchRow(a, b) {
      var row = el('div', 'match');
      var na = el('span', 'n', a), nb = el('span', 'n r', b);
      row.appendChild(na); row.appendChild(el('span', 'v', 'vs')); row.appendChild(nb);
      return { row: row, a: na, b: nb };
    }
    function matchItem(i, label) {
      var it = el('div', 'mitem');
      it.appendChild(el('div', 'mlabel', label || 'Match ' + (i + 1)));
      var mr = matchRow(matches[i].a, matches[i].b); it.appendChild(mr.row);
      return { item: it, a: mr.a, b: mr.b };
    }

    // ── C1 · Matches (the draw) ──
    function showDraw() {
      var c = document.getElementById('draw'); clear(c);
      var card = el('div', 'mcard shuffling');
      card.appendChild(el('div', 'mcard-title', 'Matches'));
      var names = [];
      matches.forEach(function (m, i) {
        var it = matchItem(i); names.push([it.a, m.a]); if (m.b !== CPU) names.push([it.b, m.b]);
        card.appendChild(it.item);
      });
      c.appendChild(card);
      c.appendChild(btn('Start match 1', 'hg-btn-primary', function () { stopShuffle(); showNext(); }));
      // Name chips shuffle, then settle into their pairs (≈ 1.5 s, tap skips).
      var t0 = performance.now(), iv = setInterval(function () {
        if (performance.now() - t0 > 1500) return stopShuffle();
        names.forEach(function (p) { p[0].textContent = players[Math.floor(Math.random() * players.length)]; });
      }, 90);
      function stopShuffle() {
        clearInterval(iv); card.classList.remove('shuffling');
        names.forEach(function (p) { p[0].textContent = p[1]; });
      }
      tap(card, stopShuffle);
      screen('draw');
    }

    // ── C2 · Next match: colours drawn per match; vs the computer the player is Yellow ──
    function showNext(keepColours) {
      var m = matches[mi];
      if (!keepColours) {
        if (m.b === CPU || Math.random() < 0.5) { yellow = m.a; red = m.b; } else { yellow = m.b; red = m.a; }
      }
      var c = document.getElementById('next'); clear(c);
      c.appendChild(el('div', 'hg-pill', matchLabel(mi)));
      c.appendChild(versus(yellow, red));
      c.appendChild(el('div', 'shout', (yellow === CPU ? 'The computer' : yellow) + ' starts!'));
      c.appendChild(el('div', 'note', red === CPU ? 'Beat the computer for up to 100 pts' : 'Put the phone flat between you'));
      c.appendChild(btn('Play', 'hg-btn-primary', startMatch));
      screen('next');
    }
    // CN4-01 / CN4-03: the coin is always the colour's coin (the computer too); the player is shown by their monster.
    function side(name, color) {
      var s = el('div', 'side');
      s.appendChild(tok(color, 'coin'));
      var t = el('div', 'ntag' + (color === R ? ' r' : ''));
      t.appendChild(HG.avatar(name, null, name === CPU ? 'cpu' : null));
      t.appendChild(el('b', null, name));
      s.appendChild(t);
      return s;
    }
    function versus(y, r) {
      var row = el('div', 'vs');
      row.appendChild(side(y, Y)); row.appendChild(el('div', 'vs-x', 'VS')); row.appendChild(side(r, R));
      return row;
    }

    // ── C3 · Match ──
    var boardEl = document.getElementById('board'), ghostEl = document.getElementById('ghostrow'), hl = document.getElementById('colhl');
    function holeX(c) { return (HOLE0 + PITCH * c) / BW * 100; }
    function holeY(r) { return (HOLE0 + PITCH * r) / BH * 100; }
    function startMatch() {
      board = []; for (var r = 0; r < ROWS; r++) { board.push([0, 0, 0, 0, 0, 0, 0]); }
      turnColor = Y; busy = false; over = false; aim = -1; aimPointer = null;
      cpuInMatch = yellow === CPU || red === CPU;
      moves = {}; moves[yellow] = 0; moves[red] = 0;
      clear(boardEl); boardEl.className = 'board';
      for (var i = 0; i < ROWS * COLS; i++) {
        var cell = el('div', 'cell');
        cell.style.left = holeX(i % COLS) + '%'; cell.style.top = holeY(Math.floor(i / COLS)) + '%';
        boardEl.appendChild(cell);
      }
      clear(ghostEl);
      for (var c = 0; c < COLS; c++) {
        var g = el('div', 'ghost'); g.style.left = ((HOLE0 - 24 + PITCH * c) / BW * 100) + '%'; ghostEl.appendChild(g);
      }
      renderPlayers();
      document.getElementById('mlabel').textContent = matchLabel(mi);
      document.getElementById('boardnote').textContent = 'Tap anywhere in a column';
      screen('match');
      nextTurn();
    }
    function nameOf(color) { return color === Y ? yellow : red; }
    function cellEl(r, c) { return boardEl.children[r * COLS + c]; }
    function isCpuTurn() { return nameOf(turnColor) === CPU; }

    function renderPlayers() {
      [[Y, 'pY', yellow], [R, 'pR', red]].forEach(function (p) {
        var t = document.getElementById(p[1]); clear(t);
        t.appendChild(el('b', null, p[2]));
        t.appendChild(tok(p[0]));
      });
    }
    // Turn banner: arrow points at the active player's tag (Yellow left, Red right).
    function renderTurn(text, big) {
      document.getElementById('pY').classList.toggle('on', turnColor === Y || big === 'draw');
      document.getElementById('pR').classList.toggle('on', turnColor === R || big === 'draw');
      var b = document.getElementById('turnbar'); clear(b);
      b.className = 'turnbar' + (big === 'draw' ? '' : turnColor === Y ? ' y' : ' rd') + (big ? ' big' : '');
      if (big) { b.appendChild(document.createTextNode(text)); return; }
      var arrow = el('span'); arrow.innerHTML = ARROW;
      var sp = el('span', 'sp');
      b.appendChild(turnColor === Y ? arrow.firstChild : sp);
      b.appendChild(el('span', null, text));
      b.appendChild(turnColor === Y ? sp : arrow.firstChild);
    }

    function nextTurn() {
      clearGhost();
      if (isCpuTurn()) { renderTurn('Computer is thinking…'); cpuThink(); }
      else renderTurn(turnColor === Y ? "Yellow's turn" : "Red's turn");
    }

    // ── C3b · Aiming: ghost on touch-down, slide to change column, release drops, release off the board cancels ──
    var box = document.getElementById('boardbox');
    function colAt(x) {
      var r = boardEl.getBoundingClientRect(), u = r.width / BW;
      if (x < r.left || x > r.right) return -1;
      return Math.max(0, Math.min(COLS - 1, Math.floor((x - r.left - (HOLE0 - PITCH / 2) * u) / (PITCH * u))));
    }
    function onBoard(x, y) {
      var r = boardEl.getBoundingClientRect(), g = ghostEl.getBoundingClientRect();
      return x >= r.left && x <= r.right && y >= g.top && y <= r.bottom;
    }
    function canPlay() { return !busy && !over && !isCpuTurn() && !HG.shell.isPaused(); }
    function showGhost(c, color) {
      clearGhost();
      if (c < 0) return;
      var g = ghostEl.children[c];
      if (topRow(c) < 0) { g.classList.add('full'); var x = el('img'); x.src = '../../assets/ui/icon-close.svg'; x.alt = 'Full'; g.appendChild(x); }
      else g.appendChild(tok(color));
      var inner = document.getElementById('boardinner').getBoundingClientRect(), u = inner.width / BW;
      hl.style.left = ((HOLE0 - 25 + PITCH * c) * u) + 'px'; hl.style.display = 'block';
    }
    function clearGhost() {
      for (var i = 0; i < ghostEl.children.length; i++) { clear(ghostEl.children[i]); ghostEl.children[i].classList.remove('full'); }
      hl.style.display = 'none';
    }

    box.addEventListener('pointerdown', function (e) {
      if (!canPlay() || aimPointer !== null) return;
      if (!onBoard(e.clientX, e.clientY)) return;
      aimPointer = e.pointerId;
      try { box.setPointerCapture(e.pointerId); } catch (x) {}
      aim = colAt(e.clientX); showGhost(aim, turnColor);
      document.getElementById('boardnote').textContent = 'Release to drop';
    });
    box.addEventListener('pointermove', function (e) {
      if (e.pointerId !== aimPointer) return;
      var c = onBoard(e.clientX, e.clientY) ? colAt(e.clientX) : -1;
      if (c !== aim) { aim = c; showGhost(aim, turnColor); }
    });
    function release(e, cancel) {
      if (e.pointerId !== aimPointer) return;
      aimPointer = null;
      var c = (!cancel && onBoard(e.clientX, e.clientY)) ? colAt(e.clientX) : -1;
      clearGhost();
      if (!canPlay()) return;
      document.getElementById('boardnote').textContent = 'Tap anywhere in a column';
      if (c < 0) return;                         // released off the board = cancel
      if (topRow(c) < 0) return refuseFull(c);
      drop(c);
    }
    box.addEventListener('pointerup', function (e) { release(e, false); });
    box.addEventListener('pointercancel', function (e) { release(e, true); });

    function refuseFull(c) {
      showGhost(c, turnColor);
      HG.feedback('fail', boardEl);
      setTimeout(clearGhost, 500);             // same player keeps the turn
    }

    function topRow(c) { for (var r = ROWS - 1; r >= 0; r--) if (!board[r][c]) return r; return -1; }

    function drop(c) {
      var r = topRow(c); if (r < 0) return;
      busy = true; anyDrop = true;
      board[r][c] = turnColor; moves[nameOf(turnColor)]++;
      var cell = cellEl(r, c), img = tok(turnColor, 'falling');
      var u = boardEl.getBoundingClientRect().height / BH;
      img.style.setProperty('--from', (-(HOLE0 + PITCH * r + 40) * u) + 'px');
      img.style.setProperty('--dur', '300ms');                            // drop ≈ 300 ms, input locked
      cell.appendChild(img);
      HG.play('drop');
      setTimeout(function () {
        busy = false;
        var line = winLine(r, c);
        if (line) return fourInARow(line);
        if (board[0].every(function (v) { return v; })) return drawGame();
        turnColor = turnColor === Y ? R : Y;
        nextTurn();
      }, 320);
    }

    function winLine(r, c) {
      var p = board[r][c], dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];
      for (var d = 0; d < 4; d++) {
        var cells = [[r, c]];
        for (var s = -1; s <= 1; s += 2)
          for (var k = 1; k < 4; k++) {
            var rr = r + dirs[d][0] * k * s, cc = c + dirs[d][1] * k * s;
            if (rr < 0 || rr >= ROWS || cc < 0 || cc >= COLS || board[rr][cc] !== p) break;
            cells.push([rr, cc]);
          }
        if (cells.length >= 4) return cells;
      }
      return null;
    }

    // ── C4 · Four in a row (≈ 1.2 s, tap skips) ──
    function fourInARow(line) {
      over = true;
      boardEl.style.setProperty('--wc', turnColor === Y ? 'var(--yellow)' : 'var(--red)');
      line.forEach(function (p) { cellEl(p[0], p[1]).classList.add('win'); });
      boardEl.classList.add('dim');
      var w = nameOf(turnColor);
      renderTurn(turnColor === Y ? 'Yellow connects 4!' : 'Red connects 4!', 'win');
      document.getElementById('boardnote').textContent = '';
      HG.play('success');
      var done = false;
      function go() { if (done) return; done = true; box.removeEventListener('pointerup', go); matchOver(w, w === yellow ? red : yellow); }
      setTimeout(function () { box.addEventListener('pointerup', go); }, 200);
      setTimeout(go, 1200);
    }

    // ── C8 · Draw → replay, colours swapped (the other player starts). No points. ──
    function drawGame() {
      over = true;
      renderTurn("It's a draw!", 'draw');
      document.getElementById('boardnote').textContent = '';
      setTimeout(function () {
        var tmp = yellow; yellow = red; red = tmp;
        var c = document.getElementById('won'); clear(c);
        c.appendChild(el('div', 'shout xl', 'Draw!'));
        c.appendChild(el('div', 'note', 'Play it again. Colours swap:'));
        c.appendChild(versus(yellow, red));
        c.appendChild(el('div', 'shout', (yellow === CPU ? 'The computer' : yellow) + ' starts!'));
        c.appendChild(btn('Replay', 'hg-btn-primary', startMatch));
        screen('won');
      }, 1200);
    }

    // ── Computer (one level, beatable): win → block → avoid giving a win above → centre; ~20 % random ──
    // CN4-02: no sweep across the top any more. "Thinking…" for 0.6–0.9 s, then the coin appears over its column
    // (150 ms) and falls with the same drop as a player's; the turn comes back to the player once it has landed.
    function cpuThink() {
      var me = turnColor, col = cpuMove(me), dur = 600 + Math.random() * 300, t0 = performance.now();
      function frame() {
        if (HG.shell.isPaused()) { cpuTimer = requestAnimationFrame(frame); t0 += 16; return; }
        if (performance.now() - t0 >= dur) { showGhost(col, me); setTimeout(function () { clearGhost(); drop(col); }, 150); return; }
        cpuTimer = requestAnimationFrame(frame);
      }
      cpuTimer = requestAnimationFrame(frame);
    }
    function legal() { var o = []; for (var c = 0; c < COLS; c++) if (topRow(c) >= 0) o.push(c); return o; }
    function winsAt(c, color) {
      var r = topRow(c); if (r < 0) return false;
      board[r][c] = color; var w = !!winLine(r, c); board[r][c] = 0; return w;
    }
    function cpuMove(me) {
      var opp = me === Y ? R : Y, L = legal(), i;
      for (i = 0; i < L.length; i++) if (winsAt(L[i], me)) return L[i];
      for (i = 0; i < L.length; i++) if (winsAt(L[i], opp)) return L[i];
      var safe = L.filter(function (c) {
        var r = topRow(c); board[r][c] = me;
        var bad = r > 0 && (function () { board[r - 1][c] = opp; var w = !!winLine(r - 1, c); board[r - 1][c] = 0; return w; })();
        board[r][c] = 0; return !bad;
      });
      var pool = safe.length ? safe : L;
      if (Math.random() < 0.2) return pool[Math.floor(Math.random() * pool.length)];
      var pref = [3, 2, 4, 1, 5, 0, 6];
      for (i = 0; i < pref.length; i++) if (pool.indexOf(pref[i]) !== -1) return pref[i];
      return pool[0];
    }

    // ── Points (Global points system): m = own tokens dropped in the deciding game ──
    function winPts(m) { return 70 + 30 * Math.max(0, Math.min(1, (21 - m) / (21 - 4))); }
    function lossPts(m) { return 10 + 30 * Math.max(0, Math.min(1, (m - 3) / (21 - 3))); }

    // ── C5 · Match result + Next up ──
    function matchOver(w, l) {
      if (w !== CPU) results[w] = { won: true, m: moves[w], pts: winPts(moves[w]) };
      if (l !== CPU) results[l] = { won: false, m: moves[l], pts: lossPts(moves[l]) };
      var last = mi === matches.length - 1;
      var c = document.getElementById('won'); clear(c);
      if (w !== CPU) HG.confetti();
      c.appendChild(el('div', 'shout xl', w === CPU ? 'Computer wins!' : w + ' wins!'));
      var sc = el('div', 'scores');
      [w, l].forEach(function (n) {
        if (n === CPU) return;
        var t = HG.tag(n, { big: true }), plus = el('div', 'plus', '+' + Math.round(results[n].pts));
        plus.appendChild(el('small', null, HG.t('pts'))); t.appendChild(plus); sc.appendChild(t);
      });
      c.appendChild(sc);
      if (!last) {
        mi++;
        var card = el('div', 'mcard');
        card.appendChild(el('div', 'mcard-title', 'Next up'));
        card.appendChild(matchItem(mi).item);
        c.appendChild(card);
        c.appendChild(btn('Next match', 'hg-btn-primary', function () { showNext(); }));
      } else {
        commit();
        c.appendChild(btn(HG.t('next'), 'hg-btn-primary', showLb));
      }
      screen('won');
    }

    // Scores committed once, after the last match of the round.
    function commit() {
      if (committed) return;
      var pts = {};
      players.forEach(function (n) { pts[n] = results[n] ? results[n].pts : 0; });
      HG.commitRound('connect4', pts); committed = true;
    }
    function showLb() { screen('lb'); HG.shell.leaderboard(document.getElementById('lb'), start); }

    // ── Shell ──
    var soloAtLoad = HG.getPlayers().length <= 1;
    HG.shell.init({
      game: 'connect4',
      headerLogo: 'assets/header-logo.svg',
      logo: 'assets/icon.webp',
      tip: 'Block your opponent before you go for your own four!',
      howTo: {
        lines: soloAtLoad
          ? ['Take turns dropping a token', 'Tap a column to drop it', 'Line up 4: across, up or diagonal', 'Beat the computer for up to 100 pts', 'A draw? Play it again']
          : ['Take turns dropping a token', 'Tap a column to drop it', 'Line up 4: across, up or diagonal', 'Everyone plays one match', 'Quick wins score extra', 'A draw? Play it again'],
        cta: "Let's go"
      },
      currentPlayer: function () { return document.getElementById('match').classList.contains('active') && !isCpuTurn() ? nameOf(turnColor) : null; },
      // The whole round is void on quit. Once the last match is over the scores are saved: ← goes straight home.
      hasProgress: function () { return anyDrop && !committed; },
      onPause: function () { aimPointer = null; clearGhost(); },
      onResume: function () {}
    });

    HG.shell.begin(['assets/header-logo.svg', 'assets/board.svg', IMG[1], IMG[2]], start);
  </script>
</body>
